# Temporary measurement harness for the macOS-vs-Linux runner evaluation.
# It mirrors ci.yml job-for-job so the numbers transfer directly, but runs every
# job twice — once per OS — from one commit, so the only variable is the runner.
# Delete this file once the evaluation is recorded.
name: OS benchmark

on:
  push:
    branches: [claude/macos-linux-ci-perf-qw6q3d]

concurrency:
  group: os-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facts:
    name: Runner facts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Report hardware and browsers
        run: |
          node -e "const os=require('node:os');console.log('platform',os.platform(),'arch',os.arch(),'cpus',os.cpus().length,'model',os.cpus()[0].model,'mem',Math.round(os.totalmem()/2**30)+'GB')"
          for candidate in \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            /usr/bin/chromium /usr/bin/chromium-browser \
            /usr/bin/google-chrome /usr/bin/google-chrome-stable; do
            if [ -x "$candidate" ]; then
              echo "present: $candidate -> $("$candidate" --version 2>/dev/null || echo unknown)"
            else
              echo "absent:  $candidate"
            fi
          done

  repo-safeguards:
    name: Repository safeguards (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo

  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests shard ${{ matrix.shard }}/4 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --reporter=dot --shard=${{ matrix.shard }}/4

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-bench-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-bench-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - run: pnpm perf:budget

  playwright-build:
    name: Playwright build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-bench-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-bench-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm e2e:build
      - uses: actions/upload-artifact@v7
        with:
          name: bench-next-build-${{ matrix.os }}
          path: .next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  playwright:
    name: Playwright shard ${{ matrix.shard }}/4 (${{ matrix.os }})
    needs: playwright-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: bench-next-build-${{ matrix.os }}
          path: .next
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bench-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Report resolved browser
        run: pnpm e2e:browser-check
      - name: Run non-visual Playwright tests
        run: |
          spec_files=()
          for spec in e2e/*.spec.ts; do
            if [ "$spec" != "e2e/visual.spec.ts" ]; then
              spec_files+=("$spec")
            fi
          done
          pnpm exec playwright test "${spec_files[@]}" --shard=${{ matrix.shard }}/4

  # Capture only. reg-suit is deliberately not run: publishing Linux-rendered
  # screenshots under this commit's S3 key would overwrite the macOS baseline
  # that every later commit is compared against.
  visual-capture:
    name: Visual capture (${{ matrix.os }})
    needs: playwright-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: bench-next-build-${{ matrix.os }}
          path: .next
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bench-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Capture visual screenshots
        run: pnpm e2e:browser-check && pnpm e2e:build && pnpm exec playwright test e2e/visual.spec.ts
      # Kept so the two OSes' screenshots can be diffed by hand afterwards —
      # this is what tells us how much of the baseline a switch would invalidate.
      - uses: actions/upload-artifact@v7
        with:
          name: bench-screenshots-${{ matrix.os }}
          path: e2e/screenshots/
          if-no-files-found: error
          retention-days: 3
