name: Update visual baselines

# One-off: regenerates e2e/visual.spec.ts-snapshots/ inside the exact
# container CI's e2e job uses, running the FULL suite (matching how the
# real e2e job invokes Playwright) rather than e2e/visual.spec.ts in
# isolation — some visual captures are sensitive to full-suite composition
# (shared demo-shop state, font-load timing under load), so an isolated
# capture doesn't reproduce what the real job sees. Commits and pushes the
# result back to the branch that triggered it. See the `visual-triage` skill.
on:
  push:
    branches:
      - claude/argos-cost-reduction-self-managed-ijwkeb
      - claude/contact-story-monitoring-t1uaz2

jobs:
  update-baselines:
    name: Regenerate baselines against the full suite
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:build
      - run: pnpm exec playwright test --update-snapshots --reporter=line
        continue-on-error: true
      - name: Commit and push regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "Regenerate visual baselines against the full suite in CI's own container"
          git push origin HEAD:${{ github.ref_name }}
