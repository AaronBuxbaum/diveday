name: Update visual baselines

# One-off: regenerates e2e/visual.spec.ts-snapshots/ on a macOS hosted runner,
# running the FULL suite (matching how the
# real e2e job invokes Playwright) rather than e2e/visual.spec.ts in
# isolation — some visual captures are sensitive to full-suite composition
# (shared demo-shop state, font-load timing under load), so an isolated
# capture doesn't reproduce what the real job sees. Commits and pushes the
# result back to the branch that triggered it. See the `visual-triage` skill.
on:
  push:
    branches:
      - main

jobs:
  update-baselines:
    name: Regenerate baselines against the full suite
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm e2e:build
      - run: pnpm exec playwright test --update-snapshots --reporter=line
        continue-on-error: true
      - name: Commit and push regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "Regenerate visual baselines against the full suite on macOS"
          git push origin HEAD:${{ github.ref_name }}
