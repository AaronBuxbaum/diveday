name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect baseline-only push
    runs-on: ubuntu-latest
    outputs:
      visual_baselines_only: ${{ steps.filter.outputs.visual_baselines_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the filter diffs github.event.before..HEAD, and
          # a shallow checkout wouldn't have `before` available to diff against.
          fetch-depth: 0
      # Approving a visual diff (see the `visual-triage` skill) means committing
      # a regenerated baseline PNG — that commit retriggers CI same as any other
      # push. When that push touches *only* committed baselines under
      # e2e/visual.spec.ts-snapshots/, the e2e job below narrows to just
      # e2e/visual.spec.ts instead of the full suite, since nothing else could
      # have changed behavior. Falls back to "false" (run everything) whenever
      # the before/after comparison isn't trustworthy — first push of a branch,
      # a force-push, or any other case where `before` isn't a known ancestor.
      - id: filter
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "visual_baselines_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^e2e/visual\.spec\.ts-snapshots/'; then
            echo "visual_baselines_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "visual_baselines_only=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Safeguards, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `checks`' `pnpm build` and `e2e`'s `pnpm e2e:build` both run a full
      # `next build` of the same source (their env vars differ only in
      # runtime DB wiring, not compiled output), so both jobs share one cache
      # key: whichever job's build lands in Actions cache first speeds up the
      # other job's next run.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      # The full pre-commit gate: repo safeguards (architecture, clock, ADR,
      # doc links) + lint + typecheck + unit tests — the same bar agents run
      # locally. Running the pieces individually here silently skipped the
      # safeguards for every PR.
      - run: pnpm check
      - run: pnpm build
      # Guards the shared first-load JS every staff page pays, so a phone at the
      # dock on weak Wi-Fi never silently gets slower (docs/architecture/performance-budgets.md).
      - run: pnpm perf:budget

  e2e:
    name: End-to-end
    needs: detect-changes
    runs-on: ubuntu-latest
    # Keep the browser executable and its Linux libraries together. Caching only
    # ~/.cache/ms-playwright restores Chromium, but every fresh runner still
    # spends minutes reinstalling the non-cacheable OS dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shared with `checks`' cache — see the comment there.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm e2e:build
      - name: Run Playwright suite
        run: |
          if [ "${{ needs.detect-changes.outputs.visual_baselines_only }}" = "true" ]; then
            echo "Push only touches committed visual baselines — running just e2e/visual.spec.ts."
            pnpm exec playwright test e2e/visual.spec.ts
          else
            pnpm exec playwright test
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
