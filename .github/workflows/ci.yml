name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, for `real-postgres` and nothing else. That job is the only one here
  # whose value decays with time rather than with the diff: it proves the
  # committed `drizzle/` set still applies to a genuine server, and the thing
  # that invalidates that proof — a migration merged on another branch, a
  # Postgres image moving under us — arrives without touching this PR's files.
  # A path-gated run alone would therefore go quiet exactly when the schema is
  # busiest.
  #
  # A workflow-level trigger fires *every* job in the file, so on its own this
  # would silently start running lint, typecheck, four unit shards, the build,
  # and eight Playwright/visual shards every night. Two reasons that is not
  # merely wasteful: it roughly doubles this workflow's runner minutes for no
  # signal (the same commit already went green on merge), and `visual-report`
  # would republish main's S3 snapshot on a run that resolved no baseline —
  # exactly the "compared nothing, reported everything as new" failure the
  # comments in that job exist to prevent. Every pre-existing job therefore
  # carries `if: github.event_name != 'schedule'`, and those guards are load
  # bearing: deleting one puts that job on the nightly schedule.
  schedule:
    # 07:00 UTC — before the working day in the Americas, after it in Europe, so
    # a red nightly is read by a human rather than found stale the next evening.
    - cron: "0 7 * * *"

concurrency:
  # Unchanged for `pull_request` and `push`, which still share one lane per ref.
  # The nightly gets a lane of its own so it can never queue behind — or hold up
  # — a merge to main, since `cancel-in-progress` is false for both of them and
  # they would otherwise serialize against each other on `ci-refs/heads/main`.
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  # Superseded PR pushes are pure waste and get cancelled. Pushes to main are
  # not: `visual-report` is what publishes that commit's screenshot snapshot to
  # S3, and reg-suit resolves a baseline by asking S3 for the *parent commit's*
  # snapshot (ADR 20260729-reg-suit-visual-regression). Cancelling an in-flight
  # main run because a second merge landed leaves that commit with no published
  # snapshot, so the next merge's baseline lookup silently degrades to "no
  # baseline" and reports every screenshot as new — the exact quiet failure the
  # visual pipeline is built to avoid.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-safeguards:
    name: Repository safeguards
    # Per-commit signal, so it has nothing to say on a nightly re-run of a commit
    # that already passed it. See the `schedule:` trigger above — this guard is
    # what keeps that trigger scoped to `real-postgres`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # check-follow-ups.mjs (part of check:repo) reads open needs-triage issues via
      # `gh issue list`. It fails open when this token can't answer, so this grant is
      # what turns the check on rather than something it depends on to pass.
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check:repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    if: github.event_name != 'schedule' # nightly runs `real-postgres` only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    if: github.event_name != 'schedule' # nightly runs `real-postgres` only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests shard ${{ matrix.shard }}/4
    # These four shards are where the `*.postgres.test.ts` files land in the
    # ordinary run, and they skip there by design: no `DIVEDAY_TEST_POSTGRES_URL`
    # is set for this job, so `describePostgres` registers a skipped suite and
    # nothing tries to open a connection. `real-postgres` below is the only job
    # that sets it.
    if: github.event_name != 'schedule' # nightly runs `real-postgres` only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Not `pnpm test -- ...`: pnpm/npm insert a literal `--` before forwarded
      # args when the target script is itself a bare command (`vitest run`),
      # so the underlying CLI sees `vitest run -- --reporter=dot --shard=…`
      # and drops everything after that `--` as unparsed — every shard then
      # silently runs the full suite instead of its 1/4 slice.
      - run: pnpm exec vitest run --reporter=dot --shard=${{ matrix.shard }}/4

  build:
    name: Build
    if: github.event_name != 'schedule' # nightly runs `real-postgres` only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # No restore-keys fallback: a prefix match would happily hand this branch
      # another branch's `.next/cache` whenever the exact key misses (e.g. main
      # has since diverged), and Turbopack's persistent cache does not always
      # invalidate a compiled query string when a Drizzle table's column list
      # changes underneath it — confirmed live on this PR, where the shared
      # build silently generated a `gear_cents` insert that doesn't exist in
      # this branch's schema.ts, because the fallback restored a cache entry
      # built from a since-merged sibling PR that added that column. A clean
      # build on a cache miss costs a few seconds; a schema-stale compiled
      # bundle produces confusing, hard-to-diagnose failures far from their
      # actual cause.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          # No restore-keys fallback, deliberately: the key hashes the exact
          # source tree, so a miss means the source changed since any prior
          # cache. A prefix-only restore-keys fallback would seed Turbopack's
          # incremental cache from a *different* source tree on every such
          # miss — which is effectively every commit, since `src/**` rarely
          # goes untouched between pushes — trusting Turbopack's incremental
          # reconciliation to correctly patch an arbitrary stale starting
          # point back to correctness. It doesn't always: this bit a PR that
          # made unusually large, repeated next.config.ts changes within one
          # branch (enabling then reverting cacheComponents) with a build that
          # compiled and passed typecheck/lint but produced a broken
          # authorize() path only reproducible against the CI-built artifact,
          # never a from-scratch local build. A cold Turbopack compile here
          # measures ~20-30s regardless, so the fallback wasn't buying
          # meaningful speed for the correctness risk it carries.
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
      # This is the only `next build` CI runs. Its output serves perf:budget below,
      # the sharded `playwright` job, and the `visual` job — all three used to pay
      # for their own separate `next build`, which cost several redundant minutes
      # of compute per run for builds that differed only in Sentry upload config
      # (see next.config.ts's isE2EBuild) and a build-time PGlite dir name, neither
      # of which affects the client bundle perf:budget measures or the app code the
      # e2e/visual suites exercise. Real production builds (the ones that actually
      # deploy) run separately through Vercel via scripts/vercel-build.mjs, with
      # SENTRY_AUTH_TOKEN configured there — that is what uploads source maps and
      # configures the release, not this job, so no Sentry token is needed here.
      - run: pnpm e2e:build
      # perf:budget reads the build manifest produced immediately above.
      - run: pnpm perf:budget
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  playwright:
    name: Playwright shard ${{ matrix.shard }}/4
    needs: build
    if: github.event_name != 'schedule' # nightly runs `real-postgres` only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      # `public/` is served off the filesystem at request time — `next build`
      # never copies it into `.next/` — so the `next-build` artifact cannot
      # carry it. `public/manifest-sw.js` is generated (gitignored, built from
      # src/worker/manifest-sw.ts) and therefore absent from this job's fresh
      # checkout: without this, `/manifest-sw.js` 404s, the service worker
      # never registers, and every offline-manifest test fails on a shell that
      # never primes. Any future generated asset under `public/` needs the
      # same treatment.
      - run: pnpm build:sw
      - uses: ./.github/actions/playwright-shell
      - name: Run non-visual Playwright tests
        run: |
          # Recursive, like playwright.config.ts's own discovery under testDir
          # (./e2e): a flat e2e/*.spec.ts glob would silently skip any spec in a
          # subdirectory here while it still ran locally.
          shopt -s globstar nullglob
          spec_files=()
          for spec in e2e/**/*.spec.ts; do
            if [ "$spec" != "e2e/visual.spec.ts" ]; then
              spec_files+=("$spec")
            fi
          done
          pnpm exec playwright test "${spec_files[@]}" --shard=${{ matrix.shard }}/4
        # e2e/servers.ts's default (cpus/2, 2 workers on this runner's 4
        # cores) was pinned to E2E_WORKERS=1 with double the shards
        # (20260731-ci-parallelization-resources-build-concurrency.md)
        # after re-enabling cacheComponents reintroduced timeout-driven
        # contention between concurrent browser+server pairs. That pin's
        # own root cause turned out to be partly fixable: `src/lib/format.ts`
        # rebuilt an `Intl.DateTimeFormat`/`Intl.NumberFormat`/
        # `Intl.RelativeTimeFormat` instance on every call instead of
        # reusing one, and every render touches at least one of them
        # (`#305`). Memoizing those cut the same 18-test contended set's
        # failure rate from 6/18 (repeatable) down to 0/18, 2/18, 1/18
        # across three reruns on 2 workers — real headroom recovered, not
        # fully back to clean. Reverting to the default worker count and
        # halving the shard count back to 4 trades that residual ~5-10%
        # per-test flake risk for half the runner minutes; `fail-fast:
        # false` means a shard flaking here fails only its own shard, not
        # the run, and E2E_WORKERS is still available as an env override
        # on this step if contention resurfaces.
        #
        # A second pass at that same root cause (TEST-M1) found the
        # memoization had stopped at `format.ts`'s file boundary while
        # sixteen other modules still constructed their own formatters —
        # `src/lib/zoned.ts` worst of all, building *three*
        # `Intl.DateTimeFormat`s per single wall-clock conversion on a
        # module 26 others import. Measured on a CI-class box, constructing
        # one and calling `formatToParts` costs ~75µs against ~6µs for
        # reusing it (12x); `Intl.ListFormat` 8.6x, and several surfaces
        # built one *inside* a `.map()`. All of it now shares the cache in
        # `src/lib/intl-cache.ts`.
        #
        # What that does NOT fix, and nobody should expect it to: 2 workers
        # each running a browser *and* a `next start` server is 4 heavy
        # processes on a 4-core runner. That is deliberate oversubscription
        # bought for half the runner minutes, and no amount of per-render
        # micro-optimization removes it — it can only be paid for with
        # E2E_WORKERS=1 and double the shards. Treat a flake here as a real
        # finding to root-cause, not as expected noise.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual capture shard ${{ matrix.shard }}/4
    needs: build
    if: github.event_name != 'schedule' # nightly runs `real-postgres` only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      # Same reason as the playwright job above: the generated service worker
      # is not in `.next/` and not in the checkout. A capture taken without it
      # would silently bake "no service worker" into the visual baseline.
      - run: pnpm build:sw
      - uses: ./.github/actions/playwright-shell
      # Only captures screenshots into e2e/screenshots — nothing here asserts,
      # so a visual change never fails this step. The reg-suit compare against
      # the S3 baseline runs once, in visual-report below, over every shard's
      # screenshots merged back together; reg-suit has no shard-aware mode of
      # its own to run per shard.
      # A failed capture whose log carries the harness's renderer probe verdict
      # ("wedged, not slow" — see e2e/visual.spec.ts's `withRendererBound` and
      # `screenshotOrGiveUp`) gets exactly one rerun of only the failed
      # captures. This is deliberately NOT a retry policy, and it must not
      # widen into one: the suite runs retries: 0 so every flake is
      # root-caused, and this wedge *has been* — repeatedly (fa51f893, the
      # 20260804 bound, run 31147282309) — with the same verdict each time: a
      # non-deterministic Chromium renderer hang that stops answering even a
      # trivial `evaluate(() => true)`, unattributed to any app or spec code,
      # arriving on arbitrary pages (the landing page, /pricing, a diver
      # record) and vanishing on same-commit reruns. The probe is what earns
      # the rerun: it distinguishes "the browser stopped answering" (rerun —
      # nothing a rerun could mask) from every app-level failure (no marker →
      # red on the first attempt, exactly as before). The blast radius
      # otherwise is out of proportion: one wedged capture fails the shard, a
      # failed shard uploads no screenshots, visual-report then compares
      # nothing — and on main, publishes no baseline, blinding visual
      # regression repo-wide (the "Refuse to miss main's baseline" step below).
      # `--last-failed` reruns only this shard's failed tests (Playwright's
      # .last-run.json holds only them), so no --shard on the rerun — resharding
      # a filtered set could silently drop tests.
      - name: Capture visual regression screenshots
        run: |
          set -o pipefail
          if pnpm exec playwright test e2e/visual.spec.ts --shard=${{ matrix.shard }}/4 2>&1 | tee capture.log; then
            exit 0
          fi
          if grep -q "wedged, not slow" capture.log; then
            echo "::warning title=Renderer wedge detected::The capture failure carries the renderer probe's 'wedged, not slow' verdict (the known unattributed Chromium hang) — rerunning only the failed captures once. If the rerun is green, the run is honest: every surface was captured; the wedge is logged above."
            pnpm exec playwright test e2e/visual.spec.ts --last-failed
          else
            exit 1
          fi
        env:
          # Same reasoning as the playwright job above: each shard is its own
          # runner, and pinning to 1 worker keeps that shard's own
          # browser+server pair from competing with itself for the runner's 4
          # cores. NOT the fix for the recurring 45s timeout on the
          # /recap/[token] capture in visual.spec.ts's long public-surfaces
          # test, though it was tried as one first: that timeout reproduced
          # identically with 2 workers and with 1 (3/3 CI runs, always the
          # same assertion), ruling out worker contention as the cause. The
          # actual fix is the test's own raised `test.setTimeout` (see the
          # comment there) — cacheComponents' aggregate render cost across
          # that test's sequential captures, not something this env var
          # addresses.
          E2E_WORKERS: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: visual-screenshots-${{ matrix.shard }}
          path: e2e/screenshots/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-visual-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  visual-report:
    name: reg-suit visual regression
    needs: visual
    # `needs:` alone skips this job outright whenever any visual shard fails,
    # which is precisely when a reviewer most needs to hear that no pixel was
    # checked — and it silently defeats the `!cancelled()` on the summary step
    # below, which was written to speak on exactly that path. Run whenever the
    # run wasn't cancelled instead; the steps decide what is still meaningful.
    #
    # The `schedule` clause is not decoration, and it is not the same guard the
    # other jobs carry. `!cancelled()` is true for a *skipped* dependency as much
    # as a failed one — that is the entire point of it — so without this the
    # nightly would skip `visual` and then run this job anyway against zero
    # screenshots, and the summary step's `!cancelled()` would faithfully
    # announce on every night's job summary that nothing was compared. Which
    # would be true, and pure noise, and would teach readers to ignore the one
    # sentence that matters when it is real.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    # Ten minutes for the compare itself, plus the twenty a stacked layer may
    # spend waiting for the layer below to publish the baseline it is keyed to
    # (`scripts/wait-for-baseline.mjs`, whose own deadline is what actually
    # bounds that wait — this is only the backstop above it).
    timeout-minutes: 35
    # The only job in this workflow that writes anything back to GitHub: the
    # sticky visual-summary comment in the last step. Scoped here rather than at
    # workflow level so no other job's third-party actions inherit write access.
    # Note that naming *any* permission drops every unnamed scope to `none` for
    # this job — `contents: read` is spelled out because the checkout below
    # needs it, not as decoration.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # This job needs the *commit* right and the *history* whole, for two
      # reasons that outlived the plugin that first demanded them.
      #
      # By SHA, not by name. This job runs 6-10 minutes after the run starts (it
      # needs every visual shard), and an auto-merged PR deletes its head branch
      # in that window; a by-name checkout then dies with "A branch or tag with
      # the name '…' could not be found", the summary step finds no script on
      # disk (MODULE_NOT_FOUND), and the run goes red on a PR that already
      # merged green. Seven runs failed exactly this way over 2026-08-06/07
      # (31206641034, 31147282309, 31123395013, 31120081666, 31118732846,
      # 31118383496, 31113162291). The head *commit* outlives the branch —
      # GitHub keeps it reachable via refs/pull/N/head forever — so fetching the
      # SHA always works.
      #
      # `github.sha` for `push` too, not `github.ref_name`: `ref: main` checks
      # out whatever `main` points to *at that moment*, not the commit that
      # triggered this run. A second merge landing in that window would silently
      # check out someone else's commit while the screenshots downloaded below
      # stay this run's own (matched by workflow run, not by SHA). reg-suit then
      # keys this run's screenshots to the *next* commit — so this commit's own
      # key is never published, and the next run's baseline lookup finds nothing
      # and reports everything as new. Two merges within ~10 minutes of each
      # other reproduced this exactly (427 new items, 0 compared, on a push to
      # main). It is also the tripwire in `scripts/reg-suit-keys.mjs`: the
      # resolver refuses to run when HEAD disagrees with the event's head sha.
      #
      # `fetch-depth: 0` because the expected key is a merge-base (or HEAD^),
      # and a shallow clone has neither.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # Name both snapshot keys outright, into this job's environment
      # (`regconfig.json` interpolates them) and into this step's outputs (the
      # wait below needs the expected one before the compare runs).
      #
      # This replaces three steps whose only job was to arrange the local git
      # graph the way `reg-keygen-git-hash-plugin` wanted to read it: a
      # `git checkout -B` to un-detach HEAD, and a `reg-suit-baseline-parent`
      # branch invented at HEAD^ so a push to main had a second branch for the
      # plugin's merge-base triangulation to find. The plugin took no options,
      # so steering the workspace was the only lever there was. Naming the key
      # is a smaller trick than any of them, and it is the half of ADR
      # 20260821-stacked-pull-requests that makes a stacked layer's baseline
      # something this pipeline states rather than infers.
      #
      # Bare `node`, before `setup` installs anything: the resolver imports node
      # builtins and one sibling script, and a run that cannot even name its
      # keys should say so before it spends four minutes on `pnpm install`.
      - name: Resolve the reg-suit snapshot keys
        id: keys
        run: node scripts/reg-suit-keys.mjs --github-env
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup
      # Every shard uploaded its own e2e/screenshots/ as a separate artifact
      # (actions/upload-artifact refuses to let two jobs write the same
      # artifact name); merge them back into one directory here so reg-suit
      # sees the full set, exactly as if a single job had captured it all.
      #
      # Both of these steps require *every* shard to have succeeded, because a
      # failed shard uploads no artifact at all: comparing what's left would
      # report that shard's surfaces as deleted, and `reg-suit run` publishes
      # the actual set as this commit's S3 snapshot, so a partial set becomes
      # the next commit's baseline and reports the missing surfaces as new
      # forever after. The summary step below still runs on that path (its
      # `!cancelled()`) and says, in those words, that nothing was compared.
      - uses: actions/download-artifact@v8
        if: ${{ needs.visual.result == 'success' }}
        with:
          pattern: visual-screenshots-*
          path: e2e/screenshots
          merge-multiple: true
      # The other half of ADR 20260821-stacked-pull-requests' fix, and the half
      # that actually removes the race: an explicit key cannot conjure a
      # snapshot. A stacked layer's baseline is the layer below's head commit,
      # and the only run that publishes that commit is the layer below's own —
      # which GitHub's cascading rebase restarts every time something merges
      # underneath it. So on the run right after a rebase both layers are in
      # flight at once, and without this the upper one asks S3 for a key that
      # will exist in four minutes' time and reports all 200 of its surfaces as
      # *new*, with `Changed: 0` at the top.
      #
      # `needs:` cannot express this: the layer below's jobs are in a different
      # workflow run on a different pull request, and `needs:` is intra-run
      # only. So it is a poll, and three things keep it from becoming the
      # nine-hour wait loop AGENTS.md was written around: it has its own
      # deadline (20 minutes, inside this job's 35), it exits 0 on every path
      # including that deadline, and it runs *only* for a stacked layer — the
      # `stacked` output is false whenever the base is the default branch, and
      # an ordinary pull request would otherwise block on a run that never
      # exists. A layer that gives up falls through to the compare and to the
      # summary below, which says "NOTHING WAS COMPARED" in those words.
      - name: Wait for the layer below to publish this layer's baseline
        if: ${{ needs.visual.result == 'success' && steps.keys.outputs.stacked == 'true' }}
        run: node scripts/wait-for-baseline.mjs
        env:
          REG_SUIT_S3_BUCKET_NAME: ${{ secrets.REG_SUIT_S3_BUCKET_NAME }}
      # `steps.keys.outcome` as well as the shards: an `if:` expression replaces
      # the implicit `success()`, so without naming it this step would run after
      # the resolver's tripwire fired and publish this run's screenshots under
      # whatever key `visual:compare` re-derived on its own — which is the one
      # thing the tripwire exists to prevent.
      - name: Run reg-suit visual regression
        if: ${{ needs.visual.result == 'success' && steps.keys.outcome == 'success' }}
        run: pnpm visual:compare
        env:
          REG_SUIT_S3_BUCKET_NAME: ${{ secrets.REG_SUIT_S3_BUCKET_NAME }}
          REG_SUIT_AWS_ACCESS_KEY_ID: ${{ secrets.REG_SUIT_AWS_ACCESS_KEY_ID }}
          REG_SUIT_AWS_SECRET_ACCESS_KEY: ${{ secrets.REG_SUIT_AWS_SECRET_ACCESS_KEY }}
          REG_SUIT_GITHUB_CLIENT_ID: ${{ secrets.REG_SUIT_GITHUB_CLIENT_ID }}
      # "Account for every changed pixel" is AGENTS.md's strongest hard rule and
      # had the pipeline's weakest signal: a diff was only discoverable by a
      # human opening the S3-hosted SPA report. This step reads the same
      # `out.json` reg-suit just published and restates it on the PR as one
      # sticky comment, updated in place on each push. It warns; it never blocks
      # (ADR 20260802-visual-diff-pr-comment).
      #
      # reg-suit's own GitHub App still posts its counts comment and the `reg`
      # commit status, and this does not replace either. It says the two things
      # that payload structurally cannot: which surfaces moved, and whether a
      # baseline resolved at all — the documented failure where every screenshot
      # reports as `new` and the changed count is a reassuring zero while
      # nothing was compared (ADR 20260729-reg-suit-visual-regression). It also
      # speaks when reg-suit is silent: the App posts nothing when
      # `reg-suit run` throws, which is exactly when a reviewer most needs to
      # know that no pixel was checked.
      #
      # `!cancelled()` rather than `success()`: the compare step stumbling is a
      # reportable outcome, not a reason to go quiet. `continue-on-error` on top
      # of the script's own catch-all — a fork PR's read-only token, an S3 blip,
      # or a GitHub API hiccup must never be the thing that reddens CI. Invoked
      # with bare `node`, not `pnpm`, so it still reports when the install or
      # the compare is what broke; the script imports node builtins only.
      - name: Summarize the visual result on the pull request
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/visual-pr-comment.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Absent on a push to main; the script then writes the summary to the
          # job summary only, instead of erroring on a PR that doesn't exist.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Falls back to the bucket name baked into the script when the secret
          # is missing (every fork PR), so it can still look for a report and
          # explain the miss rather than crash.
          REG_SUIT_S3_BUCKET_NAME: ${{ secrets.REG_SUIT_S3_BUCKET_NAME }}
      # A snapshot missed on **main** is everyone's problem, and until now it was
      # nobody's alarm. The publish steps above are correctly gated on every
      # shard succeeding — a partial set would become the next commit's baseline
      # and report the missing surfaces as new forever after — so a single flaky
      # capture means this commit publishes nothing. Main's snapshot is what
      # every branch cut from it resolves its baseline against, so that silence
      # blinds visual regression repo-wide until somebody re-runs the shard.
      #
      # Nothing said so. The shard's own red is the only signal, and it reads as
      # one flaky screenshot rather than as a safety net going down; this job
      # stayed green because the publish steps were *skipped*, not failed, and
      # the summary step is `continue-on-error`. On a pull request that is fine —
      # the sticky comment and the `reg` status both say it plainly — but a push
      # has no pull request to comment on, so the warning goes to a job summary
      # nobody opens. It cost two full investigations on 2026-08-06, days apart,
      # each starting from an unrelated branch's red `reg` and working backwards.
      #
      # So: say it, on the run that caused it, in the words of its consequence.
      # Deliberately last, after the summary step's `!cancelled()` has had its
      # turn, and deliberately push-only — a pull request's missed snapshot is
      # never anyone else's baseline.
      # The `github.ref` half is redundant today — `push:` is declared
      # `branches: [main]` at the top of this file, so a push event cannot fire
      # for anything else — and it is spelled out anyway because a step that
      # only behaves correctly by reference to a trigger four hundred lines away
      # reads as a bug to anyone who meets it here first (it was flagged as one
      # in review). It also means widening that trigger later cannot quietly
      # turn this into a red check on every feature branch.
      #
      # `!= 'success'` rather than `== 'failure'`, deliberately: `skipped`
      # counts too. `visual` needs `build`, so a broken build skips the captures
      # entirely and publishes exactly as little as a flaky shard does. The
      # message therefore says the captures did not complete rather than naming
      # a shard — the cause differs, the consequence and the fix do not. A
      # *cancelled* run cannot reach here at all: this job's own `!cancelled()`
      # has already skipped it, and pushes to main are never auto-cancelled
      # (`cancel-in-progress` is false for them, for this same reason).
      - name: Refuse to miss main's baseline silently
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.visual.result != 'success' || steps.keys.outcome != 'success') }}
        run: |
          echo "::error title=No visual baseline published for ${GITHUB_SHA}::The visual captures did not complete, or this run could not name the key to publish them under, so this commit published no S3 snapshot. Every branch cut from it resolves 0 baselines and reports every surface as new — visual regression is blind repo-wide until this is fixed. Re-run this run's failed jobs (Actions → this run → Re-run failed jobs); a green re-run publishes the snapshot and restores comparison. Do not publish a partial capture set to work around it: the missing surfaces would then read as new permanently."
          exit 1

  db-surface-changes:
    name: Detect database-surface changes
    # Cheap gate in front of `real-postgres`: a checkout and a `git diff`, so the
    # ~90% of pull requests that touch no schema surface never pay for a service
    # container. Written as a job rather than a workflow-level `paths:` filter
    # because that filter applies to the *whole workflow* — putting one on the
    # `pull_request` trigger would stop lint, typecheck, and every test shard
    # from running on any PR that happens not to touch `src/db/`.
    #
    # Also written as a `git diff` rather than a third-party filter action: the
    # comparison is four lines of shell, and this repo would rather read those
    # than take a new supply-chain dependency into every CI run to save them.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff below reaches back to the base commit, which a depth-1
          # checkout does not contain.
          fetch-depth: 0
      - id: filter
        env:
          # `base.sha` on a pull_request, `before` on a push to main.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Fail *open*, always. Every path out of this script that cannot answer
          # the question confidently answers "changed", because the cost of a
          # false positive is two minutes of runner time and the cost of a false
          # negative is an unrehearsed migration reaching production — which is
          # the entire problem this job exists to solve. A force-push and a
          # branch's first push both leave `before` as all-zeros, and neither is
          # a reason to stop checking.
          if ! git rev-parse --verify -q "${BASE_SHA}^{commit}" > /dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Base commit '${BASE_SHA}' is unresolvable — running real-postgres anyway." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Three-dot: what this branch changed, not what main did underneath it.
          # `src/db` covers both the schema and the `*.postgres.test.ts` suites;
          # the last two are the harness itself, so a change to how the proof is
          # run is also a reason to re-run it.
          changed_paths=$(git diff --name-only "${BASE_SHA}...HEAD" -- \
            src/db drizzle src/test/postgres.ts scripts/previous-release-migrations.mjs \
            .github/workflows/ci.yml)
          if [ -n "${changed_paths}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "Database surface touched — running real-postgres:"
              echo '```'
              echo "${changed_paths}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No database-surface changes — real-postgres skipped (it still runs nightly)." >> "$GITHUB_STEP_SUMMARY"
          fi

  real-postgres:
    name: Real Postgres (migrations + concurrency)
    needs: db-surface-changes
    # Two independent reasons to run, and the `always()` is what lets the second
    # one work: `needs:` on a skipped job would otherwise skip this one too, and
    # `db-surface-changes` is deliberately skipped on the nightly.
    if: ${{ always() && (needs.db-surface-changes.outputs.changed == 'true' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The whole point of the job. Everything else in this repo's db suite runs on
    # PGlite, which is a genuinely good default — fast, hermetic, no service to
    # stand up — but it is single-connection and it is not the engine production
    # runs. Two things follow that nothing else in CI can see:
    #
    #   1. The committed `drizzle/` SQL first meets a real server during the
    #      production deploy (docs/engineering/deploy-and-migrations-runbook.md,
    #      "What actually happens on deploy"). `CREATE EXTENSION pg_trgm` is the
    #      concrete example: it is a real statement in `drizzle/`, but PGlite
    #      satisfies it out-of-band with a wasm extension loaded in JavaScript
    #      before any migration runs.
    #   2. `FOR UPDATE` cannot be contended on one connection, so the oversell
    #      guard in `createBookingRecord` and the serialization in
    #      `withBookingPaymentLock` have never actually been raced. Both were
    #      verified to fail this job when their lock is deleted; the header of
    #      each suite records exactly which assertion catches it.
    services:
      postgres:
        # Pin the major version rather than tracking `postgres:latest`, so this
        # job's answer changes only when someone changes it on purpose. Keep it
        # aligned with the major Neon runs; a mismatch here means the migrations
        # are rehearsed against a different engine than they deploy to, which is
        # a quieter version of the gap this job closes.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without a health check the steps start against a server still
        # initializing, and the failure reads as a connection error rather than
        # "the container wasn't up yet".
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Required, not tidiness. `migrations.postgres.test.ts` reconstructs
          # the previous release's `drizzle/` tree out of the object store via
          # `scripts/previous-release-migrations.mjs`, and a shallow clone has no
          # merge base to reconstruct it from. That test throws rather than skips
          # when it cannot find one, precisely so this line cannot be quietly
          # dropped without someone noticing.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # A glob, not a hand-maintained list of filenames. The first draft of this
      # job named its three suites explicitly, on the theory that an auditable
      # set was worth the friction of adding a line per suite. That theory did
      # not survive the same afternoon: a fourth suite
      # (`src/db/refunds.postgres.test.ts`) was written against this harness in a
      # parallel branch, and an explicit list would have accepted it into the
      # repo while running it nowhere — it skips in the unit shards for want of
      # `DIVEDAY_TEST_POSTGRES_URL`, so this job is its only home.
      #
      # The failure mode of a stale list is silence, which is the one failure
      # mode this whole job exists to remove. Bash expands the glob before vitest
      # sees it; if it ever matches nothing, vitest exits non-zero rather than
      # reporting a cheerful zero tests.
      - name: Migrations and concurrency against a real server
        run: pnpm exec vitest run --reporter=dot src/db/*.postgres.test.ts
        env:
          # Deliberately *not* `DATABASE_URL`. That variable is what `getDb()`
          # reads, and both `vitest.config.ts` and `src/test/global-setup.ts` pin
          # it to `""` so no test can reach a real database by accident. Setting
          # it here would un-pin that for the whole run and point every unrelated
          # test at this container. One purpose-built variable keeps the blast
          # radius to the three files that ask for it by name (src/test/postgres.ts).
          DIVEDAY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
