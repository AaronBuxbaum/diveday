name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are pure waste and get cancelled. Pushes to main are
  # not: `visual-report` is what publishes that commit's screenshot snapshot to
  # S3, and reg-suit resolves a baseline by asking S3 for the *parent commit's*
  # snapshot (ADR 20260729-reg-suit-visual-regression). Cancelling an in-flight
  # main run because a second merge landed leaves that commit with no published
  # snapshot, so the next merge's baseline lookup silently degrades to "no
  # baseline" and reports every screenshot as new — the exact quiet failure the
  # visual pipeline is built to avoid.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-safeguards:
    name: Repository safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check:repo

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Not `pnpm test -- ...`: pnpm/npm insert a literal `--` before forwarded
      # args when the target script is itself a bare command (`vitest run`),
      # so the underlying CLI sees `vitest run -- --reporter=dot --shard=…`
      # and drops everything after that `--` as unparsed — every shard then
      # silently runs the full suite instead of its 1/4 slice.
      - run: pnpm exec vitest run --reporter=dot --shard=${{ matrix.shard }}/4

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # No restore-keys fallback: a prefix match would happily hand this branch
      # another branch's `.next/cache` whenever the exact key misses (e.g. main
      # has since diverged), and Turbopack's persistent cache does not always
      # invalidate a compiled query string when a Drizzle table's column list
      # changes underneath it — confirmed live on this PR, where the shared
      # build silently generated a `gear_cents` insert that doesn't exist in
      # this branch's schema.ts, because the fallback restored a cache entry
      # built from a since-merged sibling PR that added that column. A clean
      # build on a cache miss costs a few seconds; a schema-stale compiled
      # bundle produces confusing, hard-to-diagnose failures far from their
      # actual cause.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          # No restore-keys fallback, deliberately: the key hashes the exact
          # source tree, so a miss means the source changed since any prior
          # cache. A prefix-only restore-keys fallback would seed Turbopack's
          # incremental cache from a *different* source tree on every such
          # miss — which is effectively every commit, since `src/**` rarely
          # goes untouched between pushes — trusting Turbopack's incremental
          # reconciliation to correctly patch an arbitrary stale starting
          # point back to correctness. It doesn't always: this bit a PR that
          # made unusually large, repeated next.config.ts changes within one
          # branch (enabling then reverting cacheComponents) with a build that
          # compiled and passed typecheck/lint but produced a broken
          # authorize() path only reproducible against the CI-built artifact,
          # never a from-scratch local build. A cold Turbopack compile here
          # measures ~20-30s regardless, so the fallback wasn't buying
          # meaningful speed for the correctness risk it carries.
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
      # This is the only `next build` CI runs. Its output serves perf:budget below,
      # the sharded `playwright` job, and the `visual` job — all three used to pay
      # for their own separate `next build`, which cost several redundant minutes
      # of compute per run for builds that differed only in Sentry upload config
      # (see next.config.ts's isE2EBuild) and a build-time PGlite dir name, neither
      # of which affects the client bundle perf:budget measures or the app code the
      # e2e/visual suites exercise. Real production builds (the ones that actually
      # deploy) run separately through Vercel via scripts/vercel-build.mjs, with
      # SENTRY_AUTH_TOKEN configured there — that is what uploads source maps and
      # configures the release, not this job, so no Sentry token is needed here.
      - run: pnpm e2e:build
      # perf:budget reads the build manifest produced immediately above.
      - run: pnpm perf:budget
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  playwright:
    name: Playwright shard ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - uses: ./.github/actions/playwright-shell
      - name: Run non-visual Playwright tests
        run: |
          # Recursive, like playwright.config.ts's own discovery under testDir
          # (./e2e): a flat e2e/*.spec.ts glob would silently skip any spec in a
          # subdirectory here while it still ran locally.
          shopt -s globstar nullglob
          spec_files=()
          for spec in e2e/**/*.spec.ts; do
            if [ "$spec" != "e2e/visual.spec.ts" ]; then
              spec_files+=("$spec")
            fi
          done
          pnpm exec playwright test "${spec_files[@]}" --shard=${{ matrix.shard }}/4
        # e2e/servers.ts's default (cpus/2, 2 workers on this runner's 4
        # cores) was pinned to E2E_WORKERS=1 with double the shards
        # (20260731-ci-parallelization-resources-build-concurrency.md)
        # after re-enabling cacheComponents reintroduced timeout-driven
        # contention between concurrent browser+server pairs. That pin's
        # own root cause turned out to be partly fixable: `src/lib/format.ts`
        # rebuilt an `Intl.DateTimeFormat`/`Intl.NumberFormat`/
        # `Intl.RelativeTimeFormat` instance on every call instead of
        # reusing one, and every render touches at least one of them
        # (`#305`). Memoizing those cut the same 18-test contended set's
        # failure rate from 6/18 (repeatable) down to 0/18, 2/18, 1/18
        # across three reruns on 2 workers — real headroom recovered, not
        # fully back to clean. Reverting to the default worker count and
        # halving the shard count back to 4 trades that residual ~5-10%
        # per-test flake risk for half the runner minutes; `fail-fast:
        # false` means a shard flaking here fails only its own shard, not
        # the run, and E2E_WORKERS is still available as an env override
        # on this step if contention resurfaces.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual capture shard ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - uses: ./.github/actions/playwright-shell
      # Only captures screenshots into e2e/screenshots — nothing here asserts,
      # so a visual change never fails this step. The reg-suit compare against
      # the S3 baseline runs once, in visual-report below, over every shard's
      # screenshots merged back together; reg-suit has no shard-aware mode of
      # its own to run per shard.
      - name: Capture visual regression screenshots
        run: pnpm exec playwright test e2e/visual.spec.ts --shard=${{ matrix.shard }}/4
        env:
          # Same reasoning as the playwright job above: each shard is its own
          # runner, and pinning to 1 worker keeps that shard's own
          # browser+server pair from competing with itself for the runner's 4
          # cores. NOT the fix for the recurring 45s timeout on the
          # /recap/[token] capture in visual.spec.ts's long public-surfaces
          # test, though it was tried as one first: that timeout reproduced
          # identically with 2 workers and with 1 (3/3 CI runs, always the
          # same assertion), ruling out worker contention as the cause. The
          # actual fix is the test's own raised `test.setTimeout` (see the
          # comment there) — cacheComponents' aggregate render cost across
          # that test's sequential captures, not something this env var
          # addresses.
          E2E_WORKERS: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: visual-screenshots-${{ matrix.shard }}
          path: e2e/screenshots/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-visual-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  visual-report:
    name: reg-suit visual regression
    needs: visual
    # `needs:` alone skips this job outright whenever any visual shard fails,
    # which is precisely when a reviewer most needs to hear that no pixel was
    # checked — and it silently defeats the `!cancelled()` on the summary step
    # below, which was written to speak on exactly that path. Run whenever the
    # run wasn't cancelled instead; the steps decide what is still meaningful.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job in this workflow that writes anything back to GitHub: the
    # sticky visual-summary comment in the last step. Scoped here rather than at
    # workflow level so no other job's third-party actions inherit write access.
    # Note that naming *any* permission drops every unnamed scope to `none` for
    # this job — `contents: read` is spelled out because the checkout below
    # needs it, not as decoration.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # reg-keygen-git-hash-plugin derives both keys from git: the actual one
      # from HEAD, the expected one by walking back to this commit's parent and
      # asking S3 for that snapshot. A default checkout gives it neither — on a
      # pull_request it lands on a *detached* merge commit ("Can't detect branch
      # name because HEAD is on detached commit node"), and `fetch-depth: 1`
      # leaves no parent to walk to. Both keys then come back null, every
      # screenshot reads as new rather than compared, and the run dies on "Fail
      # to detect the current branch" — a red job that never looked at a pixel.
      # Check out the branch by name with full history instead: `head_ref` on a
      # pull_request, `ref_name` on a push to main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      # reg-keygen-git-hash-plugin's expected-key algorithm only works by
      # triangulating a merge-base against *other* local branches (it's built
      # for topic-branch-vs-trunk, per the checkout comment above) — it has no
      # "just diff against the previous commit" mode. A direct push to main
      # checks out only `main`, so there is no other branch, getBaseCommitHash()
      # returns null, and every push reports every screenshot as brand new
      # (confirmed in CI logs: "Failed to detect the previous snapshot key" /
      # "New items: N" / "Passed items: 0" on every main push — never actually
      # comparing a pixel). Creating a branch ref at HEAD^ gives the plugin the
      # second branch its algorithm needs, so it resolves the previous commit's
      # published S3 snapshot as the baseline instead. If that snapshot was
      # never published (e.g. the very first run), the S3 fetch just comes back
      # empty and this degrades to the same all-new behavior as before — it
      # never turns into a hard failure.
      - name: Anchor reg-suit's baseline detection to the previous commit (main pushes only)
        if: github.event_name == 'push'
        run: |
          if git rev-parse --verify -q HEAD^ > /dev/null; then
            git branch reg-suit-baseline-parent HEAD^
          fi
      - uses: ./.github/actions/setup
      # Every shard uploaded its own e2e/screenshots/ as a separate artifact
      # (actions/upload-artifact refuses to let two jobs write the same
      # artifact name); merge them back into one directory here so reg-suit
      # sees the full set, exactly as if a single job had captured it all.
      #
      # Both of these steps require *every* shard to have succeeded, because a
      # failed shard uploads no artifact at all: comparing what's left would
      # report that shard's surfaces as deleted, and `reg-suit run` publishes
      # the actual set as this commit's S3 snapshot, so a partial set becomes
      # the next commit's baseline and reports the missing surfaces as new
      # forever after. The summary step below still runs on that path (its
      # `!cancelled()`) and says, in those words, that nothing was compared.
      - uses: actions/download-artifact@v8
        if: ${{ needs.visual.result == 'success' }}
        with:
          pattern: visual-screenshots-*
          path: e2e/screenshots
          merge-multiple: true
      - name: Run reg-suit visual regression
        if: ${{ needs.visual.result == 'success' }}
        run: pnpm visual:compare
        env:
          REG_SUIT_S3_BUCKET_NAME: ${{ secrets.REG_SUIT_S3_BUCKET_NAME }}
          REG_SUIT_AWS_ACCESS_KEY_ID: ${{ secrets.REG_SUIT_AWS_ACCESS_KEY_ID }}
          REG_SUIT_AWS_SECRET_ACCESS_KEY: ${{ secrets.REG_SUIT_AWS_SECRET_ACCESS_KEY }}
          REG_SUIT_GITHUB_CLIENT_ID: ${{ secrets.REG_SUIT_GITHUB_CLIENT_ID }}
      # "Account for every changed pixel" is AGENTS.md's strongest hard rule and
      # had the pipeline's weakest signal: a diff was only discoverable by a
      # human opening the S3-hosted SPA report. This step reads the same
      # `out.json` reg-suit just published and restates it on the PR as one
      # sticky comment, updated in place on each push. It warns; it never blocks
      # (ADR 20260802-visual-diff-pr-comment).
      #
      # reg-suit's own GitHub App still posts its counts comment and the `reg`
      # commit status, and this does not replace either. It says the two things
      # that payload structurally cannot: which surfaces moved, and whether a
      # baseline resolved at all — the documented failure where every screenshot
      # reports as `new` and the changed count is a reassuring zero while
      # nothing was compared (ADR 20260729-reg-suit-visual-regression). It also
      # speaks when reg-suit is silent: the App posts nothing when
      # `reg-suit run` throws, which is exactly when a reviewer most needs to
      # know that no pixel was checked.
      #
      # `!cancelled()` rather than `success()`: the compare step stumbling is a
      # reportable outcome, not a reason to go quiet. `continue-on-error` on top
      # of the script's own catch-all — a fork PR's read-only token, an S3 blip,
      # or a GitHub API hiccup must never be the thing that reddens CI. Invoked
      # with bare `node`, not `pnpm`, so it still reports when the install or
      # the compare is what broke; the script imports node builtins only.
      - name: Summarize the visual result on the pull request
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/visual-pr-comment.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Absent on a push to main; the script then writes the summary to the
          # job summary only, instead of erroring on a PR that doesn't exist.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Falls back to the bucket name baked into the script when the secret
          # is missing (every fork PR), so it can still look for a report and
          # explain the miss rather than crash.
          REG_SUIT_S3_BUCKET_NAME: ${{ secrets.REG_SUIT_S3_BUCKET_NAME }}
