name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-safeguards:
    name: Repository safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Not `pnpm test -- ...`: pnpm/npm insert a literal `--` before forwarded
      # args when the target script is itself a bare command (`vitest run`),
      # so the underlying CLI sees `vitest run -- --reporter=dot --shard=…`
      # and drops everything after that `--` as unparsed — every shard then
      # silently runs the full suite instead of its 1/4 slice.
      - run: pnpm exec vitest run --reporter=dot --shard=${{ matrix.shard }}/4

  playwright-build:
    name: Playwright build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
      # This is the only `next build` CI runs. Its output serves perf:budget below,
      # the sharded `playwright` job, and the `visual` job — all three used to pay
      # for their own separate `next build`, which cost several redundant minutes
      # of compute per run for builds that differed only in Sentry upload config
      # (see next.config.ts's isE2EBuild) and a build-time PGlite dir name, neither
      # of which affects the client bundle perf:budget measures or the app code the
      # e2e/visual suites exercise. Real production builds (the ones that actually
      # deploy) run separately through Vercel via scripts/vercel-build.mjs, with
      # SENTRY_AUTH_TOKEN configured there — that is what uploads source maps and
      # configures the release, not this job, so no Sentry token is needed here.
      - run: pnpm e2e:build
      # perf:budget reads the build manifest produced immediately above.
      - run: pnpm perf:budget
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-next-build
          path: .next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  playwright:
    name: Playwright shard ${{ matrix.shard }}/4
    needs: playwright-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: playwright-next-build
          path: .next
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - name: Run non-visual Playwright tests
        run: |
          spec_files=()
          for spec in e2e/*.spec.ts; do
            if [ "$spec" != "e2e/visual.spec.ts" ]; then
              spec_files+=("$spec")
            fi
          done
          pnpm exec playwright test "${spec_files[@]}" --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: reg-suit visual regression
    needs: playwright-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # reg-keygen-git-hash-plugin derives both keys from git: the actual one
      # from HEAD, the expected one by walking back to this commit's parent and
      # asking S3 for that snapshot. A default checkout gives it neither — on a
      # pull_request it lands on a *detached* merge commit ("Can't detect branch
      # name because HEAD is on detached commit node"), and `fetch-depth: 1`
      # leaves no parent to walk to. Both keys then come back null, every
      # screenshot reads as new rather than compared, and the run dies on "Fail
      # to detect the current branch" — a red job that never looked at a pixel.
      # Check out the branch by name with full history instead: `head_ref` on a
      # pull_request, `ref_name` on a push to main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: playwright-next-build
          path: .next
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      # `pnpm visual` (the local/dev script) rebuilds via e2e:build before testing —
      # this job already downloaded that exact build above, so `visual:ci` skips
      # straight to the Playwright run instead of discarding the artifact and
      # recompiling it from scratch.
      - name: Run reg-suit visual regression
        run: pnpm visual:ci
        env:
          REG_SUIT_S3_BUCKET_NAME: ${{ secrets.REG_SUIT_S3_BUCKET_NAME }}
          REG_SUIT_AWS_ACCESS_KEY_ID: ${{ secrets.REG_SUIT_AWS_ACCESS_KEY_ID }}
          REG_SUIT_AWS_SECRET_ACCESS_KEY: ${{ secrets.REG_SUIT_AWS_SECRET_ACCESS_KEY }}
          REG_SUIT_GITHUB_CLIENT_ID: ${{ secrets.REG_SUIT_GITHUB_CLIENT_ID }}
      # This was the only Playwright job that kept no report, which is why a
      # hang inside `paintWholeDocument` had to be read off a stack trace
      # rather than the per-step timings the sharded jobs hand over.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-visual
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
