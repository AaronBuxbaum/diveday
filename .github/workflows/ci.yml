name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect baseline-only push
    runs-on: ubuntu-latest
    outputs:
      visual_baselines_only: ${{ steps.filter.outputs.visual_baselines_only }}
    steps:
      # A visual baseline commit made by the e2e job carries [skip ci], so it
      # does not retrigger this workflow. If a human pushes baseline-only
      # changes, keep the cheap visual-only path below.
      # When that push touches *only* committed baselines under
      # e2e/visual.spec.ts-snapshots/, the e2e job below narrows to just
      # e2e/visual.spec.ts instead of the full suite, since nothing else could
      # have changed behavior. Falls back to "false" (run everything) whenever
      # the before/after comparison isn't trustworthy — no `before` (first push
      # of a branch), or a `before` the API can't compare against (e.g. a
      # force-push origin no longer has). Uses the GitHub compare API instead of
      # a local `git diff`, so this job needs no checkout at all — a local diff
      # would need `fetch-depth: 0` (full history), which is the one thing in
      # this workflow that would actually get slower as committed baselines pile
      # up over time; the API call doesn't care how much history exists.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            echo "visual_baselines_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(gh api "repos/${{ github.repository }}/compare/$BEFORE...$AFTER" --jq '.files[].filename' 2>/dev/null) || {
            echo "visual_baselines_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^e2e/visual\.spec\.ts-snapshots/'; then
            echo "visual_baselines_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "visual_baselines_only=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Safeguards, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `checks`' `pnpm build` and `e2e`'s `pnpm e2e:build` both run a full
      # `next build` of the same source (their env vars differ only in
      # runtime DB wiring, not compiled output), so both jobs share one cache
      # key: whichever job's build lands in Actions cache first speeds up the
      # other job's next run.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      # The full pre-commit gate: repo safeguards (architecture, clock, ADR,
      # doc links) + lint + typecheck + unit tests — the same bar agents run
      # locally. Running the pieces individually here silently skipped the
      # safeguards for every PR.
      - run: pnpm check
      - run: pnpm build
      # Guards the shared first-load JS every staff page pays, so a phone at the
      # dock on weak Wi-Fi never silently gets slower (docs/architecture/performance-budgets.md).
      - run: pnpm perf:budget

  e2e:
    name: End-to-end
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Keep the browser executable and its Linux libraries together. Caching only
    # ~/.cache/ms-playwright restores Chromium, but every fresh runner still
    # spends minutes reinstalling the non-cacheable OS dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Shared with `checks`' cache — see the comment there.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm e2e:build
      - name: Run Playwright suite
        run: |
          if [ "${{ needs.detect-changes.outputs.visual_baselines_only }}" = "true" ]; then
            echo "Push only touches committed visual baselines — running just e2e/visual.spec.ts."
            pnpm exec playwright test e2e/visual.spec.ts
          else
            pnpm exec playwright test
          fi
      - name: Regenerate visual baselines for comparison
        id: regenerate_visuals
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots --reporter=line
      - name: Commit visual baseline diffs to the pull-request branch
        if: >-
          failure() && steps.regenerate_visuals.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          staging_dir="$(mktemp -d)"
          changed_files="$staging_dir/files"
          git diff --name-only -- e2e/visual.spec.ts-snapshots/ > "$changed_files"
          git ls-files --others --exclude-standard -- e2e/visual.spec.ts-snapshots/ >> "$changed_files"
          if [ ! -s "$changed_files" ]; then
            echo "No regenerated visual baselines to commit."
            exit 0
          fi
          while IFS= read -r path; do
            mkdir -p "$staging_dir/$(dirname "$path")"
            cp "$path" "$staging_dir/$path"
          done < "$changed_files"

          # The pull_request checkout is a synthetic merge ref. Switch to the
          # actual head commit before pushing, otherwise Git would reject the
          # generated baseline commit as a non-fast-forward update.
          git restore --worktree --staged -- e2e/visual.spec.ts-snapshots/ || true
          git clean -fd -- e2e/visual.spec.ts-snapshots/ || true
          git fetch origin "$PR_HEAD_REF"
          git checkout --force --detach "origin/$PR_HEAD_REF"
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp "$staging_dir/$path" "$path"
          done < "$changed_files"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes after switching to the pull-request branch."
            exit 0
          fi
          git commit -m "ci: capture visual baseline diffs [skip ci]"
          git push origin "HEAD:$PR_HEAD_REF"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
