name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect baseline-only push
    runs-on: macos-latest
    outputs:
      visual_baselines_only: ${{ steps.filter.outputs.visual_baselines_only }}
    steps:
      # A visual baseline commit made by the visual job carries [skip ci], so it
      # does not retrigger this workflow. If a human pushes baseline-only
      # changes, keep the cheap visual-only path below.
      # When that push touches *only* committed baselines under
      # e2e/visual.spec.ts-snapshots/, the Playwright matrix below is skipped
      # and the serialized visual job runs just the visual spec. Falls back to
      # "false" whenever the comparison is not trustworthy.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            echo "visual_baselines_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(gh api "repos/${{ github.repository }}/compare/$BEFORE...$AFTER" --jq '.files[].filename' 2>/dev/null) || {
            echo "visual_baselines_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv '^e2e/visual\.spec\.ts-snapshots/'; then
            echo "visual_baselines_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "visual_baselines_only=false" >> "$GITHUB_OUTPUT"
          fi

  repo-safeguards:
    name: Repository safeguards
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    name: Unit tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --reporter=dot

  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      # perf:budget reads the build manifest produced immediately above.
      - run: pnpm perf:budget

  playwright-build:
    name: Playwright build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm e2e:build
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-next-build
          path: .next/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  playwright:
    name: Playwright shard ${{ matrix.shard }}/4
    needs: [detect-changes, playwright-build]
    if: needs.detect-changes.outputs.visual_baselines_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: playwright-next-build
          path: .next
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - name: Run non-visual Playwright tests
        run: |
          spec_files=()
          for spec in e2e/*.spec.ts; do
            if [ "$spec" != "e2e/visual.spec.ts" ]; then
              spec_files+=("$spec")
            fi
          done
          pnpm exec playwright test "${spec_files[@]}" --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual regression (serialized)
    needs: [detect-changes, playwright-build]
    if: needs.detect-changes.result == 'success' && needs.playwright-build.result == 'success'
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: playwright-next-build
          path: .next
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      - name: Run visual Playwright suite
        run: pnpm exec playwright test e2e/visual.spec.ts
      # Only this job can update or commit baselines. The regular shards exclude
      # visual.spec.ts, so no two jobs can write the same snapshot directory.
      - name: Regenerate visual baselines for comparison
        id: regenerate_visuals
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots --reporter=line
      - name: Commit visual baseline diffs to the pull-request branch
        if: >-
          failure() && steps.regenerate_visuals.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          staging_dir="$(mktemp -d)"
          changed_files="$staging_dir/files"
          git diff --name-only -- e2e/visual.spec.ts-snapshots/ > "$changed_files"
          git ls-files --others --exclude-standard -- e2e/visual.spec.ts-snapshots/ >> "$changed_files"
          if [ ! -s "$changed_files" ]; then
            echo "No regenerated visual baselines to commit."
            exit 0
          fi
          while IFS= read -r path; do
            mkdir -p "$staging_dir/$(dirname "$path")"
            cp "$path" "$staging_dir/$path"
          done < "$changed_files"

          # The pull_request checkout is a synthetic merge ref. Switch to the
          # actual head commit before pushing, otherwise Git would reject the
          # generated baseline commit as a non-fast-forward update.
          git restore --worktree --staged -- e2e/visual.spec.ts-snapshots/ || true
          git clean -fd -- e2e/visual.spec.ts-snapshots/ || true
          git fetch origin "$PR_HEAD_REF"
          git checkout --force --detach "origin/$PR_HEAD_REF"
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp "$staging_dir/$path" "$path"
          done < "$changed_files"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes after switching to the pull-request branch."
            exit 0
          fi
          git commit -m "ci: capture visual baseline diffs [skip ci]"
          git push origin "HEAD:$PR_HEAD_REF"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
