name: Playwright workers trial

# Historical rollout experiment, retained as a repeatability probe.
#
# The original 2026-11-01 question compared twelve functional shards at one
# worker with six at two (profile: /mnt/project-files/ci-speed/2026-11-01-ci-profile.md).
# By 2026-11-09, ci.yml had adopted the six-shard/two-worker arrangement
# this workflow repeats. It is NOT a current control-versus-trial
# comparison and does not claim a new saving. Read ci.yml's matrix/env for the
# current production topology rather than carrying a duplicate count here.
#
# This manual-only lane repeats its explicitly configured deal from one build
# to inspect variance, functional failures and runner contention. Historical
# estimates (~77/172 runner-minutes, ~79 minutes of spec time, and a ~7.5 minute
# shard target) describe that dated experiment, not present acceptance evidence.
# Decide any new change from comparable controls and measured summaries; no
# visual-worker increase is implied. CI retains its accepted visual-noise tradeoff.
# There is no reg-suit or visual baseline here. Never dispatched on push/PR.
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Times each shard runs from the one build (to see variance)
        default: "3"
        type: string

concurrency:
  group: playwright-workers-trial
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm e2e:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trial-next-build
          path: |
            .next/
            !.next/cache/**
            !.next/trace
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  shard:
    name: Shard ${{ matrix.shard }}/6 at two workers
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trial-next-build
          path: .next
      - run: pnpm build:sw:assets
      - uses: ./.github/actions/playwright-shell
      - name: Run this shard at two workers
        env:
          REPEAT: ${{ inputs.repeat }}
          E2E_WORKERS: "2"
        run: |
          set -uo pipefail
          mapfile -t spec_files < <(node scripts/e2e-shard.mjs --shard=${{ matrix.shard }}/6 --explain --summary="$GITHUB_STEP_SUMMARY")
          if [ "${#spec_files[@]}" -eq 0 ]; then
            echo "::error::scripts/e2e-shard.mjs dealt this shard nothing."
            exit 1
          fi
          if printf '%s\n' "${spec_files[@]}" | grep -qx 'e2e/agency-check-extension.spec.ts'; then
            pnpm exec playwright install chromium
          fi
          if printf '%s\n' "${spec_files[@]}" | grep -Eq '^e2e/(boarding-certification-paper|five-dive-departure-log|trip-document-print|public-document-identity)[.]spec[.]ts$'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          failed=0
          for i in $(seq 1 "${REPEAT:-3}"); do
            started=$(date +%s)
            status=0
            PLAYWRIGHT_JSON_OUTPUT_NAME="results-${i}.json" \
              pnpm exec playwright test "${spec_files[@]}" --reporter=line,json > "run-${i}.log" 2>&1 || status=$?
            echo "shard ${{ matrix.shard }}/6, run ${i}: ${#spec_files[@]} specs, exit ${status}, $(( $(date +%s) - started ))s" | tee -a "$GITHUB_STEP_SUMMARY"
            # Into the job log, where a cloud session can read it: every failed
            # test with its first error line, then the ten slowest spec files
            # (their summed test time, the input for a deal tuned to two workers).
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const files = new Map(); const failed = [];
              const walk = (suite, file) => {
                for (const s of suite.suites ?? []) walk(s, s.file ?? file);
                for (const t of suite.specs ?? []) {
                  const res = t.tests?.[0]?.results?.at(-1);
                  files.set(file, (files.get(file) ?? 0) + (res?.duration ?? 0));
                  if (!t.ok) failed.push(file + " :: " + t.title + " :: " + (res?.error?.message ?? "").split("\n")[0].slice(0, 200));
                }
              };
              for (const s of r.suites) walk(s, s.file);
              for (const f of failed) console.log("TRIAL-FAILED " + f);
              const top = [...files].sort((a, b) => b[1] - a[1]).slice(0, 10);
              for (const [f, ms] of top) console.log("TRIAL-SLOW " + f + " " + ms + "ms");
            ' "results-${i}.json" 2>&1 | sed "s|^|shard ${{ matrix.shard }}/6 run ${i}: |" || true
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-workers-trial-${{ matrix.shard }}
          path: |
            run-*.log
            results-*.json
            test-results/
          if-no-files-found: ignore
          retention-days: 7
