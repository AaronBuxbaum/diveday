# A preview deployment, only when somebody asks for one.
#
# `vercel.json`'s `git.deploymentEnabled` turns automatic preview deployments
# off for every branch but `main`. That is the largest single reduction in this
# project's Vercel build minutes available — over the 63 hours to 2026-09-04
# this repository carried 170 branch commits against 69 merges, so roughly three
# of every four builds were previews, and nothing in the repository consumed
# one: the e2e and visual suites run against locally-built servers in CI, and
# review screenshots come from `scripts/screenshot.mjs` against a local dev
# server. What a preview is actually for is a human looking at a branch, which
# is an event, not a property of every push.
#
# So this workflow is the door back in. Three ways through it, and the third is
# what makes the first two worth having:
#
#   * label a pull request `preview`
#   * comment `/preview` on one
#   * push to a pull request that already carries the `preview` label
#
# The label is sticky on purpose: turn it on once and that branch previews on
# every push for as long as it is on, which is the old behaviour restored for
# exactly the branches that want it. Remove the label to stop.
name: Preview

on:
  pull_request:
    types: [labeled, synchronize]
  issue_comment:
    types: [created]

concurrency:
  # One preview per pull request, newest wins. A second push while the first is
  # still building would otherwise pay for a deployment nobody will open.
  group: preview-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy a preview
    # Three conditions, one per door. `issue_comment` fires for issues as well
    # as pull requests, so that arm checks `.pull_request` exists before
    # anything else — and checks `author_association`, because anybody with a
    # GitHub account can comment on a public repository and this spends money.
    # `labeled`/`synchronize` need no such check: both require write access.
    if: >-
      (github.event_name == 'pull_request'
        && github.event.action == 'labeled'
        && github.event.label.name == 'preview')
      || (github.event_name == 'pull_request'
        && github.event.action == 'synchronize'
        && contains(github.event.pull_request.labels.*.name, 'preview'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '/preview')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The three Vercel credentials live on their own environment with no
    # required reviewer — `infra-deploy`'s copies sit behind an approval gate,
    # which is right for a production deploy and would make an on-demand preview
    # useless. Manual action "preview-deploy-token" is how they get there.
    environment: preview-deploy
    steps:
      # `github.event.pull_request.head.sha` on a `pull_request` event, and the
      # pull request's head ref on a comment — where the event carries an issue
      # and no head at all. `refs/pull/N/head` is the branch tip, deliberately
      # not `/merge`: a preview is meant to show the branch, not a speculative
      # merge of it into whatever main is this minute.
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
      - uses: ./.github/actions/setup
      - name: Confirm the Vercel credentials are set
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -uo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name resolved to the empty string. The preview-deploy environment does not carry it yet — complete manual action \"preview-deploy-token\" in docs/engineering/manual-actions.md."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
      # `vercel deploy`, not `vercel build && vercel deploy --prebuilt`: building
      # on the runner would save the last of the Vercel build minutes, and costs
      # pulling the project's Preview environment — DATABASE_URL and every
      # sealed credential with it — down onto a GitHub runner. A handful of
      # requested previews a week is not worth moving secrets for.
      #
      # The upload honours `.vercelignore`, which is what keeps `.env*`, the
      # local `.pglite` database and 5.7 MB of `docs/` out of the tarball.
      # `scripts/vercel-ignore-build.mjs` sees no git metadata in a CLI deploy,
      # fails open, and builds — correct here, since somebody asked for this one.
      - id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          url=$(pnpm exec vercel deploy --archive=tgz --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Say where it is
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          {
            echo "Preview: ${URL}"
            echo
            echo "Pushes to this branch keep previewing while the \`preview\` label is on. Remove it to stop."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > preview-comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file preview-comment.md
