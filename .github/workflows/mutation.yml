name: Breakage drills

# The weekly whole-file breakage drills (ADR 20261122-diff-mutation-testing;
# docs/engineering/testing.md#breakage-drills). Each pull request already breaks the lines it
# changed in money and safety code (ci.yml's `mutation-diff`); this breaks every line of the
# files in scripts/mutation/floors.json, one leg per file, and holds each file's score (the
# share of breaks a test caught) to its floor, which only rises. A red run files itself
# (scripts/workflow-alert.mjs).
on:
  schedule:
    # Sundays 04:00 UTC, before the Monday jobs.
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: mutation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Files to drill
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: files
        run: echo "files=$(node -e 'const f=require("./scripts/mutation/floors.json");console.log(JSON.stringify(Object.keys(f).filter((k)=>!k.startsWith("//"))))')" >> "$GITHUB_OUTPUT"

  drill:
    name: Drill ${{ matrix.file }}
    needs: plan
    runs-on: ubuntu-24.04
    # The run's own budget is 40 minutes (scripts/mutation/run.mjs, BUDGET_MS_FILE); the rest
    # is setup and the baseline.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.plan.outputs.files) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Break every line and hold the score to its floor
        env:
          FILE: ${{ matrix.file }}
        run: pnpm mutate --file "$FILE" --summary "$GITHUB_STEP_SUMMARY"
      - id: name
        if: ${{ !cancelled() }}
        env:
          FILE: ${{ matrix.file }}
        run: echo "name=mutation-file-${FILE//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.name.outputs.name }}
          path: .agent-out/mutation-file.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  alert:
    name: Report a red run
    needs: [plan, drill]
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/workflow-alert.mjs --workflow mutation --outcome "${{ needs.plan.result == 'success' && needs.drill.result == 'success' && 'success' || 'failure' }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
