name: Mutation testing

# Weekly Stryker runs on the pure safety modules (test review 2026-10-14, decision 7; ADR
# 20261015-coverage-and-mutation-testing). Each leg mutates one module and runs the `lib` tests
# that cover it (stryker.config.mjs, stryker.vitest.config.ts); a mutant every test still passes
# names an assertion the suite is missing. `scripts/mutation-issues.mjs` files a module's
# survivors as one `needs-triage` issue, comments the next week's list on it while any survive,
# and closes it when none do.
#
# Weekly and off the pull-request path, deliberately: a module is minutes of reruns, and what it
# measures moves with the tests, not with one change. Readiness and trip admission first, the two
# gates on whether a diver may book and board; `waivers`, `authz`, `roll-call`, `trips` and
# `deposits` join the matrix once these two issues are being worked.
#
# **The schedule is off until runtime mutants work under Vitest 5** (stryker.config.mjs says
# what the trial run found): a scheduled run today would file every in-function mutant as a
# survivor. Turn it back on, as Sundays 04:00 UTC (`cron: "0 4 * * 0"`, before the Monday
# durations refresh, follow-ups and persona walk), once a manual run kills an in-function mutant.
on:
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutate:
    name: Mutate ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        module: [src/lib/readiness.ts, src/lib/trip-admission.ts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Run Stryker
        run: pnpm test:mutation --mutate "${{ matrix.module }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30
      # Only the default branch files: a manual run on a branch reports in its log and artifact.
      - name: File, update or close the module's survivors issue
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: node scripts/mutation-issues.mjs --report reports/mutation/mutation.json --module "${{ matrix.module }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # A leg that crashed (Stryker or the filing step, not a survivor: survivors never fail a leg)
  # opens or updates one `ci-red` issue; a whole green run closes it. One job after the matrix,
  # so two red legs cannot race to open two issues.
  alert:
    name: Report a red run
    needs: mutate
    if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/workflow-alert.mjs --workflow mutation --outcome "${{ needs.mutate.result == 'success' && 'success' || 'failure' }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
