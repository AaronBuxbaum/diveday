name: Infra

# Two ways in, deliberately kept apart:
#
#   - `pull_request`: automatic and read-only. A PR that touches `infra/` gets
#     `cdk synth` (does the app even build a template) and `cdk diff` (what
#     would change against the deployed stack) as a check, with the diff
#     posted as a PR comment. It can create and discard a CloudFormation
#     change set; it can never execute one. **The comment is posted by a
#     second job that holds no AWS credentials** (`comment`): the job that
#     does hold the diff role runs only first-party actions and this
#     repository's own commands, and hands the diff text over as an artifact
#     (issue #2543).
#   - `workflow_dispatch`: a human clicking "Run workflow" in the Actions tab,
#     for running either of those two on demand outside a PR, or for actually
#     deploying. Deploying additionally requires a required reviewer to
#     approve the `infra-deploy` GitHub Environment (repo Settings ->
#     Environments — manual action "github-actions-cdk-oidc" in
#     docs/engineering/manual-actions.md) before the job can even obtain AWS
#     credentials: GitHubActionsCdkDeployRole's OIDC trust condition
#     (infra-stack.ts §18) names that environment specifically, so there is no
#     token to mint until that approval has happened.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      command:
        description: cdk command to run
        type: choice
        options:
          - diff
          - deploy
        default: deploy

concurrency:
  # workflow_dispatch runs (in particular a deploy) must never be cancelled by
  # a later PR push sharing this workflow's name, so they get a lane keyed to
  # their own run rather than to a ref.
  group: infra-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra-changed:
    name: Detect infra changes
    # Only pull_request needs this gate. A workflow_dispatch run is already an
    # explicit "do this now" from a human — it should never be silently
    # skipped because the current branch happens not to touch infra/.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only checks out and greps history; no write scope of any kind needed.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff below reaches back to the base commit, which a depth-1
          # checkout does not contain.
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Fail *open*: an unresolvable base is a reason to run the check, not
          # to skip it silently.
          if ! git rev-parse --verify -q "${BASE_SHA}^{commit}" > /dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Base commit '${BASE_SHA}' is unresolvable — running the infra check anyway." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed_paths=$(git diff --name-only "${BASE_SHA}...HEAD" -- infra cdk.json config/postgres-image/Dockerfile .github/workflows/infra.yml)
          if [ -n "${changed_paths}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "Infra surface touched — running cdk synth + diff:"
              echo '```'
              echo "${changed_paths}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No infra changes — cdk synth/diff skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  diff:
    name: cdk synth + diff
    needs: infra-changed
    # A skipped `infra-changed` (every workflow_dispatch run) must not skip
    # this job by propagation. GitHub's actual rule (confirmed the hard way —
    # every workflow_dispatch run of this workflow silently no-op'd until this
    # was added): a job whose `needs:` job was itself skipped is skipped by
    # default regardless of this job's own `if:`, unless that `if:` is
    # wrapped in `always()`. ci.yml's real-postgres/visual-report jobs
    # (`db-surface-changes` gate) already carry this wrapper; this job's
    # condition below was written without it.
    # `command: deploy` also lands here, not just `command: diff`: the
    # `deploy` job below `needs: diff`, so its required-reviewer approval
    # gate comes after a fresh synth+diff is already visible in this run,
    # not blind against whatever a past PR's diff comment happened to show.
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && (inputs.command == 'diff' || inputs.command == 'deploy')) || (github.event_name == 'pull_request' && needs.infra-changed.outputs.changed == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # GitHubActionsCdkDiffRole's trust condition (infra-stack.ts §18) accepts
    # any workflow run in this repo — no `environment:` gate here, because
    # this role can only create and discard a change set, never execute one.
    #
    # **No `pull-requests: write` here** (issue #2543). The job that holds the
    # diff role (which can reach the bucket-wide file-publishing role) must not
    # also be the one that talks to the pull request, so a third-party action
    # that posts can never run beside the credentials. It uploads the diff;
    # `comment` below posts it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The wrapper, not a raw `cdk synth`: matches the command a workstation
      # operator actually runs. No AWS credentials needed for this either way
      # -- the stack does no context lookups (no Vpc.fromLookup, no
      # StringParameter.valueFromLookup), so `cdk synth` is a pure local
      # build, and scripts/infra-cdk.mjs skips its login check specifically
      # for `synth` for exactly this reason. Running it before credentials
      # are configured means a broken template fails the check even when the
      # AWS_CDK_DIFF_ROLE_ARN variable (manual action "github-actions-cdk-oidc")
      # has not been set up yet.
      - run: pnpm infra:synth --quiet
      # This repo restricts who can open a pull request to collaborators
      # (repo setting: pull_request_creation_policy=collaborators_only), which
      # is the primary control here. This condition is defense in depth on
      # top of that, not instead of it: GitHubActionsCdkDiffRole's trust
      # policy accepts any `pull_request`-triggered run in this repo,
      # including one whose head is a fork, and this is the one place in the
      # job that credentials actually get requested — everything before this
      # point (synth) needs none. Skip the AWS-credentialed steps entirely
      # when the PR's head repo isn't this one; `cdk synth` above still ran
      # and still reported a broken template regardless.
      #
      # aws-actions/configure-aws-credentials reports an empty role-to-assume
      # as an opaque "Credentials could not be loaded" SDK error, which reads
      # like a broken workflow rather than an unfinished one-time setup step.
      # Say the actual cause: the manual action hasn't been done yet.
      - name: Confirm the diff role ARN is set
        if: vars.AWS_CDK_DIFF_ROLE_ARN == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          echo "::error::AWS_CDK_DIFF_ROLE_ARN repository variable is not set. Complete manual action \"github-actions-cdk-oidc\" in docs/engineering/manual-actions.md, then set it to the GitHubActionsCdkDiffRoleArn stack output."
          exit 1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          # The session's default region, not where anything deploys -- every
          # stack names its own (config/aws-regions.mjs). It follows the estate
          # so an ad-hoc `aws` call in this job reaches the right place.
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_CDK_DIFF_ROLE_ARN }}
          role-session-name: gha-cdk-diff
      # **The diff, as text, with this repository's own commands.** The wrapper
      # (`scripts/infra-cdk.mjs`) is what a workstation operator runs, and
      # `configure-aws-credentials` above already exported the session, so it
      # is a quiet passthrough here. `tee` keeps the run log readable while the
      # file is what the next steps and the artifact read; `shell: bash` is
      # what turns on `pipefail`, so a failing `cdk diff` still fails the step.
      - name: cdk diff
        id: cdk-diff
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: pnpm infra:diff --no-color 2>&1 | tee cdk-diff.txt
      # **One resource type, and it is here because the type has no
      # non-destructive edit at all.** `Budget` -- the nested object holding
      # the limit and the notifications -- is a Replacement-only property of
      # `AWS::Budgets::Budget`, so *every* change to the cost guardrail's cap
      # or thresholds is a replacement, and a check that fails on any
      # destructive change would red every time, forever, on a replacement that
      # destroys nothing: CloudFormation creates the new budget before deleting
      # the old one, and a budget holds no data -- only the cap and the five
      # email notifications, which the replacement carries over verbatim. The
      # stack deliberately sets no `budgetName` so the two never collide during
      # that overlap (docs/engineering/infrastructure-runbook.md S6's
      # troubleshooting note; ADR 20260802-aws-cost-guardrails).
      #
      # Scoped to that one type on purpose. A replacement of a bucket, a
      # secret, an IAM user or a distribution still fails this job, which is
      # the whole reason the check is here. This used to be the diff action's
      # `allowedDestroyTypes`; it is the same rule, read off the diff text by
      # twelve lines of node in this file instead of by a third-party action
      # that held the diff role.
      #
      # Pull requests only: a dispatched `diff` or `deploy` run reads the diff
      # in its log and was never failed by it.
      - name: Find destructive changes
        id: destructive
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          node --input-type=module - <<'EOF'
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";
          const allowed = new Set(["AWS::Budgets::Budget"]);
          const ansi = /\u001b\[[0-9;]*m/g;
          const found = readFileSync("cdk-diff.txt", "utf8")
            .replace(ansi, "")
            .split("\n")
            .map((line) => line.match(/^\[[-~]\] (AWS::\S+) .*\b(destroy|orphan|replace)\s*$/))
            .filter((match) => match && !allowed.has(match[1]))
            .map((match) => match[0]);
          writeFileSync("destructive.txt", found.join("\n"));
          appendFileSync(process.env.GITHUB_OUTPUT, `found=${found.length > 0}\n`);
          EOF
      # `if: always()` so a failed diff still hands over what it printed; the
      # artifact holds text only, no credential, and nobody but this run reads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          name: cdk-diff
          path: |
            cdk-diff.txt
            destructive.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Fail on a destructive change
        if: steps.destructive.outputs.found == 'true'
        run: |
          echo "::error::This pull request replaces or removes an existing resource. The list is in the cdk diff comment; a deliberate removal is deployed by a human with the deploy workflow."
          cat destructive.txt
          exit 1

  # **The pull-request comment, from a job with no AWS credentials** (issue
  # #2543). It reads the diff text the `diff` job uploaded and posts it with the
  # GitHub CLI and this run's own token, `pull-requests: write` and nothing else:
  # no `id-token`, no `contents`, no role to assume, and no third-party action.
  # One sticky comment, found by its marker and edited in place on each push.
  comment:
    name: Post the cdk diff
    needs: diff
    # `always()` so a red diff (a destructive change) still gets its comment;
    # skipped when the diff never ran, and for a fork's pull request, which
    # got no credentials and no diff.
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.diff.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: cdk-diff
      - name: Post the diff to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- diveday:cdk-diff -->'
          {
            echo "$marker"
            echo "### cdk diff"
            if [ -s cdk-diff.txt ]; then
              if [ -s destructive.txt ]; then
                echo
                echo "**This replaces or removes an existing resource:**"
                echo
                echo '```'
                sed 's/```/` ` `/g' destructive.txt
                echo '```'
              fi
              echo
              echo '```'
              # GitHub caps a comment near 65,000 characters, and a fence inside
              # the diff would end ours early.
              head -c 55000 cdk-diff.txt | sed 's/```/` ` `/g'
              echo
              echo '```'
            else
              echo
              echo "The diff did not finish. Read [the run]($RUN_URL)."
            fi
          } > body.md
          # --jq runs per page; `first` stops on the first match without a
          # pipe (a `| head -n 1` under pipefail can SIGPIPE gh). Only the
          # workflow's own bot comment counts, never a human who pasted the marker.
          existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "first(.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id) // empty" | sed -n 1p)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@body.md > /dev/null
          fi

  deploy:
    name: cdk deploy
    needs: diff
    # Three things this condition has to do at once, each learned the hard way:
    #
    # `always() &&` -- skip propagation is *transitive*, and a job's own `if:`
    # does not override it. `infra-changed` is skipped on every
    # workflow_dispatch (its condition is pull_request-only); `diff` survives
    # that only because of the same wrapper; and `deploy` still inherited the
    # skip *through* `diff` even with `diff` succeeding. Fixing `diff` alone
    # (2026-08-12) left this job silently skipping on every `command: deploy`
    # dispatch, with no error anywhere -- proved by a temporary debug job whose
    # only difference from this one was `if: always()`: it ran, printing
    # `github.event_name: workflow_dispatch`, `inputs.command: deploy`,
    # `needs.diff.result: success`, `full condition: true`, while this job,
    # same run, same `needs:`, reported "This job was skipped".
    #
    # `needs.diff.result == 'success'` -- `always()` means this job's `if:`
    # fully replaces the default success-gating, so without this a failed
    # synth/diff would not stop the deploy from proceeding straight to the
    # reviewer-approval gate. (It also has to survive `always()` itself, which
    # would otherwise run this job even when `diff` failed outright.)
    #
    # `inputs.command == 'deploy'` -- `diff` runs for both commands, so this is
    # what keeps a `command: diff` dispatch from deploying.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.command == 'deploy' && needs.diff.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The approval gate. GitHub only issues an OIDC token for a job that
    # references this environment once a required reviewer has approved the
    # run (repo Settings -> Environments -> infra-deploy) — the click the
    # first sentence of this file promises. GitHubActionsCdkDeployRole's trust
    # condition (infra-stack.ts §18) additionally hard-codes this exact
    # environment name, so a job that omitted this line would have no role to
    # assume even if it somehow got this far.
    environment: infra-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Confirm the deploy role ARN is set
        if: vars.AWS_CDK_DEPLOY_ROLE_ARN == ''
        run: |
          echo "::error::AWS_CDK_DEPLOY_ROLE_ARN repository variable is not set. Complete manual action \"github-actions-cdk-oidc\" in docs/engineering/manual-actions.md, then set it to the GitHubActionsCdkDeployRoleArn stack output."
          exit 1
      # The same shape as the step above, for the four credentials the
      # post-deploy wizard needs rather than the role this job assumes.
      #
      # GitHub resolves an absent secret to the empty string with no warning of
      # any kind, so three quite different situations are indistinguishable from
      # inside a run: the credential was never created, it was stored at the
      # wrong scope (repository instead of this environment), or it exists under
      # a name that does not match the one the `env:` block below reads. Each
      # one surfaces minutes later, inside `gh` or `vercel`, phrased as an
      # authentication problem that names neither the variable nor the setup
      # step. A real `command: deploy` run (31564090783) was spent failing to
      # establish which of the three it was — and by then `cdk deploy` had
      # already updated the stack.
      #
      # So this runs before the AWS credentials step, not just before
      # `pnpm infra:deploy`: an unfinished setup refuses the run outright
      # instead of leaving it half-done. Naming the variable, not only the
      # manual action, is what makes a name mismatch legible as one. Checking
      # all four before exiting means one run tells the operator everything
      # that is missing.
      #
      # Nothing here skips a credential-less wizard step and continues: ADR
      # 20260811-ci-deploy-full-wizard rejects that partial-success shape, and
      # this changes only the error a human reads, never whether the wizard
      # fails.
      - name: Confirm the post-deploy wizard's credentials are set
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -uo pipefail
          missing=0
          require() {
            if [ -z "$2" ]; then
              echo "::error::$1 resolved to the empty string. Either the infra-deploy environment secret named $1 does not exist yet (complete manual action \"$3\" in docs/engineering/manual-actions.md, which stores it under exactly that name), or it exists under a different name or at a different scope than the secrets.$1 this workflow reads."
              missing=1
            fi
          }
          require GH_TOKEN "$GH_TOKEN" ci-github-admin-token
          require VERCEL_TOKEN "$VERCEL_TOKEN" ci-vercel-deploy-token
          require VERCEL_ORG_ID "$VERCEL_ORG_ID" ci-vercel-deploy-token
          require VERCEL_PROJECT_ID "$VERCEL_PROJECT_ID" ci-vercel-deploy-token
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to deploy: the post-deploy wizard would shell out to gh/vercel with an empty credential. Nothing has been deployed by this run."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_CDK_DEPLOY_ROLE_ARN }}
          role-session-name: gha-cdk-deploy
      # `pnpm infra:deploy`, not a bare `cdk deploy`: once the required-reviewer
      # approval above has already gated this job, ADR 20260811-ci-deploy-full-wizard
      # runs the same wrapper a workstation operator would — write
      # .env.local/.env.vercel/.env.github from the diveday/env secret, then
      # answer yes to every post-deploy wizard question non-interactively.
      # GitHubActionsCdkDeployRole is granted a read of exactly that one secret
      # and nothing else (infra-stack.ts §18); the diff role two jobs up still
      # cannot read any secret at all. GH_TOKEN/VERCEL_TOKEN authenticate the
      # gh/vercel CLIs the wizard shells out to (manual actions
      # "ci-github-admin-token"/"ci-vercel-deploy-token", §17); VERCEL_ORG_ID/
      # VERCEL_PROJECT_ID let the Vercel CLI act on the linked project without
      # an interactive `vercel link`. --ci-unattended is what actually selects
      # this behavior -- deliberately not an ambient env var like CI, which a
      # local dev tool could set by convention (ADR 20260811-ci-deploy-full-wizard);
      # only this one `run:` line ever passes it.
      #
      # All three stacks, named rather than `--all`: the app builds three now
      # (ADR 20260910-one-region-in-us-east-2, ADR
      # 20260910-one-region-in-us-east-2) -- `DiveDay` in PRIMARY_REGION,
      # `DiveDayEmail` in SES_REGION, `DiveDayGlobal` pinned to us-east-1 because Route 53
      # publishes its health-check metric nowhere else. A job that deployed
      # whatever the app happened to contain would be a different job after the
      # next stack is added. `aws-region` below is only the session's default --
      # each stack deploys into its own env region, through the bootstrap roles
      # that region was bootstrapped with (manual action `cdk-bootstrap`, which
      # does every region in config/aws-regions.mjs).
      #
      # All four are `secrets.` on the `infra-deploy` *environment*, named for
      # the variable each one becomes, rather than repository-level secrets and
      # variables under longer INFRA_DEPLOY_-prefixed names. The environment is
      # already this job's approval gate, so scoping them to it means they do
      # not exist for any other job in this repository -- and the names being
      # identical on both sides of the `:` is what stops the two from drifting
      # apart. VERCEL_ORG_ID/VERCEL_PROJECT_ID are identifiers rather than
      # credentials and would be fine as variables; they are secrets here only
      # so that all four live in one place. The cost is that they are redacted
      # from logs, so a wrong one reads as an empty string in a failure message
      # rather than as itself — which is why the step above checks all four for
      # emptiness by name before this job touches AWS at all.
      - run: pnpm infra:deploy DiveDay DiveDayEmail DiveDayGlobal --require-approval never --ci-unattended
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
