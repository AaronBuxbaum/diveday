name: Persona bots

# The weekly persona walk (N-61): every surface `docs/product/personas.md`
# names, opened against the demo shop as the persona who lives on it, probed
# deterministically (an axe scan plus a handful of DOM checks), photographed
# through `scripts/screenshot.mjs`, and filed as `needs-triage` issues under a
# hard weekly ceiling. `scripts/persona-bots.mjs` and
# docs/engineering/testing.md say what it does; ADR
# 20260907-persona-bots-file-under-a-ceiling says why the ceiling is where it is.
#
# Weekly rather than nightly, deliberately: what the walk measures is a slow
# drift across the whole front end, not the effect of one merge, and the thing
# it costs is a person's attention rather than a runner's minutes. Monday
# morning, so a finding arrives at the start of a week somebody can spend on it.
#
# **Nothing here is a gate.** `scripts/persona-bots.mjs` exits 0 on every
# failure it can have — no browser, no build, a walk that did not complete, an
# unreachable `gh`, a body its own guard refuses — printing `DID NOT RUN` or
# `DID NOT FILE` and the reason. A red X on a scheduled job that files issues
# would train everyone to ignore it; the run log and the uploaded findings are
# where this reports.
on:
  schedule:
    # 07:00 UTC on Mondays — after ci.yml's nightly run and simulate-day's, so a
    # red build is already in the inbox above a persona finding.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Shape the issues and print them, but file nothing"
        type: boolean
        default: false
      judge:
        description: "Also read the screenshots as Nadia and Kai (costs an API call per persona)"
        type: boolean
        default: false

concurrency:
  group: persona-bots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  walk:
    name: Fifteen personas, one lap each
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # `gh issue create` and `gh issue comment`, plus the `gh issue list` reads
      # that make the dedupe and the suppression rules work. Without write the
      # run still walks and still reports; it just files nothing.
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright-shell
      # One build, the same e2e build ci.yml's `build` job makes; the walk then
      # reuses it (`--no-build`) rather than paying for a second one.
      - run: pnpm e2e:build
      # `--judge` is reachable only from `workflow_dispatch`, never from the
      # Monday `schedule` above, and that is what makes the judged pass opt-in
      # (#1498). A model's opinion arriving unattended in a tracker is a trust
      # question before it is a coverage one; the cron gets this only after a
      # month of dispatched output somebody has read. `ANTHROPIC_API_KEY` is a
      # repository secret a human adds — the same shape as `GITHUB_TOKEN` here,
      # not a `config/env-registry.mjs` row, which is the application's own
      # environment. Absent, the run prints `DID NOT JUDGE` and files the
      # mechanical findings as usual.
      - name: Walk the personas
        run: pnpm persona:bots --no-build ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.judge && '--judge' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only on the run that can use it. The Monday `schedule` cannot pass
          # `--judge`, so on 51 weeks out of 52 this would put a live API key
          # into the environment of a thirty-minute job that downloads a
          # browser and executes the whole dependency tree, for no benefit at
          # all (`security-reviewer`, issue #1498).
          ANTHROPIC_API_KEY: ${{ inputs.judge && secrets.ANTHROPIC_API_KEY || '' }}
      # The findings and the screenshots every filed issue links to — the
      # walk's whole published output, and deliberately the only thing that
      # leaves the runner. Playwright's own trace is off (see the walk's
      # config): it would carry headers, cookies and DOM snapshots to a public
      # artifact without passing through the pipeline that decides what this
      # bot may publish. Uploaded whether or not the walk completed — a partial
      # run's findings file is the one worth reading, and it is the only copy
      # of the pictures.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: persona-bots
          path: persona-bots/
          if-no-files-found: warn
          retention-days: 30
