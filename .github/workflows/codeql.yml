name: CodeQL

# Once a day, not on every push to main. GitHub's "default setup" scans each
# push and cannot be scheduled, so this advanced-setup workflow replaces it
# (default setup must be off in Settings → Code security, or both run).
# It never runs on a pull request, and can be run by hand from the Run workflow
# button. A schedule or a manual run never reaches a PR, so scripts/base-ci.mjs
# does not hold a branch to its red (docs/agents/verifying.md).
on:
  schedule:
    # Mondays 05:30 UTC (weekly until the first real booking, #2987).
    - cron: "30 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
