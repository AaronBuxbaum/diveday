name: Durations refresh

# The four unit shards, the six Playwright shards and the eight visual shards
# are dealt by each file's or test's recorded CI duration
# (`scripts/test-durations.json` for src/test/shard-sequencer.ts,
# `scripts/e2e-durations.json` for scripts/e2e-shard.mjs). Those files are
# committed so every shard computes the same deal, which means they go stale
# by hand: the unit file was refreshed on 2026-10-09 and the shards already
# spread 49% on 10-10 (code review 2026-10-10, finding 6). Every CI run
# already uploads what it measured, so this folds the newest main run's
# measurements back in once a week and commits them when they moved.
#
# Straight to main, not through a pull request, whenever the diff is the two
# JSON files and nothing else (the only files this job writes; the step
# checks rather than assumes). A pull request opened with the workflow token
# starts no CI of its own (GitHub's rule against recursive runs) and main has
# no required checks, so the PR this job used to open waited for someone to
# notice it every week while the shards kept dealing on stale figures (code
# review 2026-10-11, finding 2). The files are data no reviewer reads and the
# next CI run consumes; `main`'s ruleset forbids only deletion and force
# pushes, so a fast-forward push from `contents: write` lands. If main moved
# under the job it rebases once and retries; if the push is still refused
# (a ruleset added later, a conflict) it falls back to the pull request on
# `automation/durations-refresh`, and the backlog routine
# (.claude/skills/backlog-routine/SKILL.md) gives an open one an empty commit
# so CI runs, then merges it. The fallback needs the repository setting
# "Allow GitHub Actions to create and approve pull requests" (Settings →
# Actions → General); without it that step fails with a 403 and says so.
on:
  schedule:
    # Mondays 05:00 UTC, an hour ahead of follow-ups.yml.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: durations-refresh
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: Fold the latest main run's durations into the committed files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: automation/durations-refresh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The newest successful push run on main that ran the shards: a
      # docs-only main run skips them and uploads nothing, so it is passed
      # over rather than read as "every file vanished".
      - name: Find the run to read
        id: run
        run: |
          for id in $(gh run list --workflow ci.yml --branch main --event push --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | .name')
            if [ "$(grep -c '^unit-durations-' <<<"$names")" -eq 4 ]; then
              echo "id=${id}" >> "$GITHUB_OUTPUT"
              echo "Reading run ${id}."
              exit 0
            fi
          done
          echo "::error::No successful main run in the last 20 carries all four unit-durations artifacts."
          exit 1
      - name: Download its measurements
        run: |
          gh run download "${{ steps.run.outputs.id }}" -p 'unit-durations-*' -D artifacts/unit
          gh run download "${{ steps.run.outputs.id }}" -p 'e2e-durations-*' -D artifacts/e2e || true
          gh run download "${{ steps.run.outputs.id }}" -p 'visual-durations-*' -D artifacts/visual || true
      # A suite is folded only when every one of its shards reported: a
      # partial set would drop the missing shard's items back to their
      # estimate and make the next deal worse, not better. "Every" is the
      # count that run had, read from its own job names ("Playwright shard
      # n/N"), not today's matrix: the run read can predate a re-shard (run
      # 4565 had four Playwright shards against today's six), and its four
      # files still cover every spec it ran (code re-review 2026-10-13,
      # item 17).
      - name: Merge
        run: |
          shopt -s nullglob
          node scripts/merge-test-durations.mjs artifacts/unit/*/*.json
          jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ steps.run.outputs.id }}/jobs?per_page=100" --paginate --jq '.jobs[].name')
          shards() { grep -c "^$1 shard [0-9]*/" <<<"$jobs" || true; }
          want_functional=$(shards "Playwright")
          want_visual=$(shards "Visual capture")
          functional=(artifacts/e2e/*/functional-*.json)
          visual=(artifacts/visual/*/visual-*.json)
          inputs=()
          if [ "$want_functional" -gt 0 ] && [ "${#functional[@]}" -eq "$want_functional" ]; then inputs+=("${functional[@]}"); else echo "::warning::${#functional[@]} of ${want_functional} Playwright shards recorded durations; keeping the committed functional figures."; fi
          if [ "$want_visual" -gt 0 ] && [ "${#visual[@]}" -eq "$want_visual" ]; then inputs+=("${visual[@]}"); else echo "::warning::${#visual[@]} of ${want_visual} visual shards recorded durations; keeping the committed visual figures."; fi
          if [ "${#inputs[@]}" -gt 0 ]; then node scripts/e2e-durations.mjs merge "${inputs[@]}"; fi
          git diff --stat -- scripts/test-durations.json scripts/e2e-durations.json
      - name: Commit to main, or open the pull request
        run: |
          if git diff --quiet -- scripts/test-durations.json scripts/e2e-durations.json; then
            echo "Nothing moved; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          message="Refresh the recorded shard durations from CI run ${{ steps.run.outputs.id }}"
          others=$(git status --porcelain --untracked-files=no | awk '{print $2}' | grep -v -x -e scripts/test-durations.json -e scripts/e2e-durations.json || true)
          git add scripts/test-durations.json scripts/e2e-durations.json
          git commit -m "$message"
          if [ -z "$others" ]; then
            if git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }; then
              echo "Committed to main: $(git rev-parse HEAD)."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Pushing to main was refused; opening a pull request instead."
          else
            echo "::warning::The working tree changed outside the two durations files (${others//$'\n'/, }); opening a pull request instead of committing to main."
          fi
          git switch -c "$BRANCH"
          git push --force origin "$BRANCH"
          body="Folds the durations CI run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }} recorded into \`scripts/test-durations.json\` and \`scripts/e2e-durations.json\`, which the unit, Playwright and visual shards are dealt by. Opened by .github/workflows/durations-refresh.yml because committing straight to main was refused; nothing here is hand-written. A token-opened pull request starts no CI: push an empty commit to it, then merge."
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Refresh the recorded shard durations" --body "$body"
          fi
