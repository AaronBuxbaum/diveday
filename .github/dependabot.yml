version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Three days: the 2025 npm worm releases spread within hours of publication
    # and were pulled within a day or two, so a bump that waits three days skips
    # them. Security updates are not delayed. pnpm's own `minimumReleaseAge`
    # was dropped on 2026-10-15 because it also failed `--frozen-lockfile`
    # installs for versions main had already locked; Dependabot's cooldown is
    # the one delay now.
    cooldown:
      default-days: 3
    groups:
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Every Action is pinned to a commit (scripts/check-action-pins.mjs); these
    # updates move the SHA and its `# vX.Y.Z` comment together, three days
    # after a release rather than the hour a moved tag could be poisoned.
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
  # Both the database dump and restore drill read this pinned image reference.
  - package-ecosystem: docker
    directory: /config/postgres-image
    schedule:
      interval: weekly
    ignore:
      - dependency-name: docker/library/postgres
        versions:
          - ">=18"
