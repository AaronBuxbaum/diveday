version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Three days, the same delay as `minimumReleaseAge` in pnpm-workspace.yaml:
    # a pull request for a version younger than that would fail CI's install.
    # Security updates are not delayed.
    cooldown:
      default-days: 3
    groups:
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Every Action is pinned to a commit (scripts/check-action-pins.mjs); these
    # updates move the SHA and its `# vX.Y.Z` comment together, three days
    # after a release rather than the hour a moved tag could be poisoned.
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
