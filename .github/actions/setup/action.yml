name: Setup pnpm and install
description: >
  Sets up pnpm, Node 24 with the pnpm cache, and installs dependencies with a
  frozen lockfile — the setup steps every CI job needs before it can run
  anything else.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        # GitHub-hosted runners start empty, so they restore the pnpm store
        # from the Actions cache. The Mac's runners keep theirs on a shared
        # volume (scripts/mac-runner/start.sh), and restoring it there would
        # download the whole store over a home connection for every job.
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
    - run: pnpm install --frozen-lockfile
      shell: bash
