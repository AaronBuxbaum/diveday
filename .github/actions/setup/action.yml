name: Setup pnpm and install
description: >
  Sets up pnpm, Node 24 with the pnpm cache, and installs dependencies with a
  frozen lockfile — the setup steps every CI job needs before it can run
  anything else.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
