name: Setup pnpm and install
description: >
  Sets up pnpm, Node 24 with the pnpm cache, and installs dependencies with a
  frozen lockfile — the setup steps every CI job needs before it can run
  anything else.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
