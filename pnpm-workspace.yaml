allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  koffi: true

# One day, in minutes (pnpm 12): a version is not installable until it has been published this long.
minimumReleaseAge: 1440

# Urgent security fix: add the package here as `name@version` (exact, so only that release skips
# the delay), say why in a comment, and delete the entry once the version is a day old.
minimumReleaseAgeExclude: []

patchedDependencies:
  '@vercel/analytics@2.0.1': patches/@vercel__analytics@2.0.1.patch
  next@16.4.5: patches/next@16.4.5.patch

publicHoistPattern:
  - '@img/*'
  - 'detect-libc'
  - 'semver'

update:
  ignoreDeps:
    - '@types/node'

# Force patched releases only where the resolved dependency graph still needs them.
overrides:
  # passkit-generator 3.5.8 pins vulnerable Joi; retain its API on the patched 17.x line.
  'passkit-generator>joi@17.13.4': '17.13.9'
  '@modelcontextprotocol/sdk@<1.32.0': '>=1.32.0 <2'
  '@vercel/cli-config>zod@>=4.0.0 <4.6.6': '^4.6.7'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'minimatch@>=10.0.0 <10.2.3': '^10.2.3'
  'path-to-regexp@>=4.0.0 <6.3.0': '^6.3.0'
  'path-to-regexp@>=8.0.0 <8.4.0': '^8.4.0'
  'smol-toml@<1.7.1': '>=1.7.1 <2'
  'tar@<7.5.21': '^7.5.21'
  'tmp@<0.2.6': '>=0.2.6 <0.3'
  'undici@<6.29.1': '^6.29.1'

# Reviewed advisories with no patched release (issue #2826). pnpm has no expiry field: re-check
# with `pnpm audit` monthly (issue #2238) and delete the entry once a patched release exists.
# braces <=3.0.3, stack exhaustion on deeply nested brace patterns: reached only through
# micromatch/fast-glob in dev tooling (vercel CLI, reg-suit), which globs our own file names, never
# untrusted input; no request path imports it. Reviewed 2026-10-18; revisit by 2026-11-18.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

permissions:
  drizzle-kit:
    skills: true

virtualStoreType: global

# Next's declarations import React types from its real global-store location.
# Declare the type peer so strict callback inference does not rely on project hoisting.
packageExtensions:
  next@16.4.5:
    peerDependencies:
      '@types/react': '^19.0.0'
    peerDependenciesMeta:
      '@types/react':
        optional: true
