<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650;700&amp;display=swap">
  <style>
    :root {
      --bg: #faf9f6; --surface: #ffffff; --sunken: #f1efe9; --border: #e3e0d7; --border-strong: #8a8577;
      --ink: #0c2a35; --muted: #5b6f77;
      --primary: #0e7490; --primary-tint: #e7f1f4;
    }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Geist', -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
    .tnum { font-variant-numeric: tabular-nums; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--primary); }
    .tab { font-size: 14px; font-weight: 500; color: var(--muted); padding: 6px 12px; border-radius: 10px; white-space: nowrap; }
  </style>
</helmet>

<div style="width: 1440px; height: 540px; background: var(--bg); box-sizing: border-box; overflow: hidden;">

  <!-- Chrome: note the dock and tabs after the fold — four destinations plus More -->
  <div style="height: 56px; display: flex; align-items: center; gap: 20px; padding: 0 32px; background: rgba(250,249,246,.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">BM</div>
      <span style="font-size: 15px; font-weight: 650; letter-spacing: -0.01em;">Blue Mantis Divers</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#5b6f77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 2px; margin-left: 16px;">
      <span class="tab" style="background: var(--primary-tint); color: var(--primary); font-weight: 600;">Today</span>
      <span class="tab">Check-in</span>
      <span class="tab">Divers</span>
      <span class="tab">Board</span>
      <span class="tab" style="display: inline-flex; align-items: center; gap: 5px;">More
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#5b6f77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"></path></svg>
      </span>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; background: var(--surface);">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#5b6f77" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"></circle><path d="M10.6 10.6L13.6 13.6"></path></svg>
      <span style="font-size: 13px; color: var(--muted);">Search</span>
      <span style="font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;">&#8984;K</span>
    </div>
  </div>

  <!-- The whole-page collapse: a heading, one sentence, the one act. No empty groups, no boxes. -->
  <div style="width: 1024px; margin: 0 auto; padding: 44px 0 40px; box-sizing: border-box;">
    <p class="eyebrow" style="margin: 0;">Today &middot; Tue, Sep 1</p>
    <h1 style="margin: 10px 0 0; font-size: 34px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15;">A quiet day at the dock.</h1>
    <p style="margin: 10px 0 0; font-size: 16px; color: var(--muted); max-width: 640px;">No boats today, and nothing is waiting on you.</p>

    <div style="margin-top: 32px;">
      <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 10px; background: var(--primary); color: #ffffff; font-size: 14.5px; font-weight: 600;">+ Add a departure</span>
    </div>

    <div style="margin-top: 48px; display: flex; align-items: center; gap: 12px; min-height: 54px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);">
      <span style="font-size: 15px; font-weight: 600;">Next departure &middot; Sat, Sep 5</span>
      <span class="tnum" style="margin-left: auto; font-size: 13.5px; color: var(--muted);">7:00 AM Morning Two-Tank — Molasses Reef &middot; 2 of 12 booked</span>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#5b6f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"></path></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
